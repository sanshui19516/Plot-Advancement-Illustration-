<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>生日的婚纱 · 档案</title>
<style>
@import url("https://fontsapi.zeoseven.com/134/main/result.css");
:root{
  --wine:352,58%,32%;
  --wine-deep:352,50%,18%;
  --amber:38,62%,48%;
  --amber-soft:38,50%,62%;
  --char:0,0%,5%;
  --char-card:0,0%,9%;
  --ink:35,20%,88%;
  --ink-dim:35,12%,55%;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:"LXGW Marker Gothic","PingFang SC","Microsoft YaHei",sans-serif;
  font-weight:normal;
  background:transparent;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:16px;
}
.dossier{
  position:relative;
  width:100%;max-width:560px;
  background:
    linear-gradient(170deg,hsla(var(--char-card),0.95),hsla(var(--char),0.98)),
    radial-gradient(ellipse at 85% 5%,hsla(var(--wine),0.16),transparent 55%);
  backdrop-filter:blur(24px) saturate(1.3);
  -webkit-backdrop-filter:blur(24px) saturate(1.3);
  border-radius:20px 4px 20px 4px;
  border:1px solid hsla(var(--amber),0.15);
  box-shadow:0 24px 70px rgba(0,0,0,0.6),inset 0 1px 0 hsla(var(--amber),0.07);
  overflow:hidden;
  animation:up .8s cubic-bezier(.25,.8,.25,1) both;
}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.dossier::before{
  content:'';position:absolute;inset:0;
  background-image:repeating-linear-gradient(-45deg,hsla(var(--amber),0.015) 0,hsla(var(--amber),0.015) 1px,transparent 1px,transparent 11px);
  pointer-events:none;
}
.dossier::after{
  content:'';position:absolute;left:-25%;bottom:-30%;width:65%;height:70%;
  background:radial-gradient(ellipse,hsla(var(--wine),0.13),transparent 65%);
  pointer-events:none;animation:bleed 16s ease-in-out infinite alternate;
}
@keyframes bleed{0%{transform:translate(0,0) scale(1);opacity:.4}100%{transform:translate(8%,-6%) scale(1.2);opacity:.85}}
.dossier>*{position:relative;z-index:1;}

/* 顶部档案标签 */
.dossier-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px 12px;
  border-bottom:1px dashed hsla(var(--amber),0.12);
}
.head-left{display:flex;align-items:baseline;gap:10px;min-width:0;}
.d-no{
  font-size:9px;letter-spacing:2px;
  color:hsla(var(--wine),0.85);
  padding:2px 7px;border:1px solid hsla(var(--wine),0.35);
  border-radius:2px;transform:rotate(-2deg);
  white-space:nowrap;
}
.d-title{
  font-size:15px;font-weight:700;letter-spacing:4px;
  color:hsla(var(--ink),0.95);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.d-stamp{
  flex-shrink:0;
  width:40px;height:40px;border-radius:50%;
  border:1.5px solid hsla(var(--wine),0.5);
  display:flex;align-items:center;justify-content:center;
  font-size:9px;letter-spacing:1px;line-height:1.1;
  color:hsla(var(--wine),0.85);
  text-align:center;
  transform:rotate(-8deg);
  opacity:0.85;
  padding:3px;
}

/* 主体 */
.dossier-body{
  display:grid;
  grid-template-columns:92px 1fr;
  gap:14px;
  padding:16px 18px 8px;
}

/* 左侧竖排相框 */
.gallery{
  display:flex;flex-direction:column;gap:8px;
}
.gallery .g{
  position:relative;
  width:100%;aspect-ratio:3/4;
  border-radius:3px;overflow:hidden;
  border:1px solid hsla(var(--amber),0.18);
  box-shadow:0 4px 14px rgba(0,0,0,0.45);
  background:hsla(var(--wine),0.15);
  transition:all .4s ease;
}
.gallery .g img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease;}
.gallery .g:hover{border-color:hsla(var(--amber),0.4);transform:translateY(-2px);}
.gallery .g:hover img{transform:scale(1.06);}
.gallery .g::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to top,hsla(var(--char),0.5),transparent 45%);
  pointer-events:none;
}

/* 右侧：抽屉标签 */
.info{
  display:flex;flex-direction:column;gap:9px;
  min-width:0;
}
.drawer{
  position:relative;
  background:hsla(var(--char),0.4);
  border:1px solid hsla(var(--amber),0.09);
  border-left:2px solid hsla(var(--wine),0.45);
  border-radius:2px 10px 2px 10px;
  padding:9px 11px;
  transition:all .3s ease;
}
.drawer:hover{
  background:hsla(var(--wine-deep),0.3);
  border-left-color:hsla(var(--amber),0.7);
}
.drawer .lab{
  font-size:9px;letter-spacing:2px;
  color:hsla(var(--amber),0.55);
  margin-bottom:4px;
  display:flex;align-items:center;gap:5px;
}
.drawer .lab svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:1.8;}
.drawer .txt{
  font-size:10.5px;line-height:1.7;
  color:hsla(var(--ink),0.8);
}
.drawer .txt .hl{color:hsla(var(--amber-soft),0.85);}
.drawer .txt .warn{color:hsla(var(--wine),0.9);}

/* 底部按钮 */
.dossier-foot{
  padding:8px 18px 20px;
  display:flex;justify-content:center;
}
.enter-btn{
  position:relative;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  width:100%;max-width:300px;
  padding:12px 24px;
  background:linear-gradient(135deg,hsla(var(--wine),0.5),hsla(var(--wine-deep),0.75));
  border:1px solid hsla(var(--amber),0.3);
  border-radius:4px 30px 4px 30px;
  color:hsla(var(--ink),1);
  font-family:inherit;font-size:13px;font-weight:600;letter-spacing:5px;
  cursor:pointer;transition:all .35s cubic-bezier(.25,.8,.25,1);
  box-shadow:0 6px 20px rgba(0,0,0,0.4),inset 0 1px 0 hsla(var(--amber),0.18);
}
.enter-btn::before{
  content:'';position:absolute;inset:3px;
  border:1px solid hsla(var(--amber),0.12);
  border-radius:3px 28px 3px 28px;
  pointer-events:none;
}
.enter-btn:hover{
  transform:translateY(-2px);
  border-color:hsla(var(--amber),0.55);
  box-shadow:0 10px 30px rgba(0,0,0,0.5),inset 0 1px 0 hsla(var(--amber),0.28);
}
.enter-btn:active{transform:scale(.97);transition-duration:.06s;}
.enter-btn svg{width:14px;height:14px;fill:none;stroke:hsla(var(--amber-soft),0.7);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

@media (max-width:480px){
  body{padding:10px;}
  .dossier{border-radius:16px 3px 16px 3px;}
  .dossier-head{padding:13px 13px 10px;}
  .d-title{font-size:13px;letter-spacing:3px;}
  .d-stamp{width:34px;height:34px;font-size:8px;}
  .dossier-body{grid-template-columns:78px 1fr;gap:10px;padding:13px 13px 6px;}
  .drawer{padding:8px 9px;}
  .drawer .txt{font-size:10px;}
  .dossier-foot{padding:6px 13px 16px;}
  .enter-btn{font-size:12px;letter-spacing:3px;padding:11px 18px;}
}
</style>
</head>
<body>

<div class="dossier">
  <div class="dossier-head">
    <div class="head-left">
      <span class="d-no">档案 · 壹</span>
      <span class="d-title">生日的婚纱</span>
    </div>
    <div class="d-stamp">三年<br>水</div>
  </div>

  <div class="dossier-body">
    <div class="gallery">
      <div class="g"><img src="https://testingcf.jsdelivr.net/gh/sanshui19516/Plot-Advancement-Illustration-@main/%E6%AF%8D%E7%8C%AA%E5%A6%88%E5%A6%88/%E6%B2%88%E6%99%9A%E6%A3%A0%20(4).jpg" alt="" /></div>
      <div class="g"><img src="https://testingcf.jsdelivr.net/gh/sanshui19516/Plot-Advancement-Illustration-@main/%E6%AF%8D%E7%8C%AA%E5%A6%88%E5%A6%88/%E6%B2%88%E6%99%9A%E6%A3%A0%20(5).jpg" alt="" /></div>
      <div class="g"><img src="https://testingcf.jsdelivr.net/gh/sanshui19516/Plot-Advancement-Illustration-@main/%E6%AF%8D%E7%8C%AA%E5%A6%88%E5%A6%88/%E6%B2%88%E6%99%9A%E6%A3%A0%20(6).jpg" alt="" /></div>
    </div>

    <div class="info">
      <div class="drawer">
        <div class="lab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>发布信息</div>
        <div class="txt">仅发布于 <span class="hl">Discord 类脑</span><br>作者：<span class="hl">三年的水</span></div>
      </div>

      <div class="drawer">
        <div class="lab"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>授权说明</div>
        <div class="txt">
          <span class="hl">允许二改（署名）</span><br>
          二改后需标注出处<br>
          <span class="warn">禁止商用</span> / <span class="warn">禁止墙内二传</span>
        </div>
      </div>

      <div class="drawer">
        <div class="lab"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>本卡包含</div>
        <div class="txt">状态栏 · 选项栏 · 阶段联动<br>四场景行为 · 衣柜 · 场景条目</div>
      </div>

      <div class="drawer">
        <div class="lab"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>使用说明</div>
        <div class="txt">导入角色卡 → 配置状态栏/选项栏正则 → 开始对话</div>
      </div>
    </div>
  </div>

  <div class="dossier-foot">
    <button class="enter-btn" id="enterBtn">
      进入故事
      <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </button>
  </div>
</div>

<script>
(function(){
'use strict';

function initDossier(){
  var old = document.getElementById('enterBtn');
  if (!old) return;
  var nb = old.cloneNode(true);
  old.parentNode.replaceChild(nb, old);
  nb.addEventListener('click', async function(){
    nb.style.opacity = '0.5';
    nb.style.pointerEvents = 'none';
    try{
      var messages;
      try{ messages = await getChatMessages?.('0', {include_swipe:true}); }
      catch(_){ var ctx = window.SillyTavern?.getContext?.(); messages = ctx?.chat?.messages; }
      if (!messages || !messages.length) return;
      var first = messages[0];
      if (!first.swipes) return;
      var target = 2;
      if (first.swipes.length <= target) return;
      var swipeText = first.swipes[target];
      var setChatMessage = window.setChatMessage || window.SillyTavern?.getContext?.()?.setChatMessage;
      if (typeof setChatMessage === 'function'){
        await setChatMessage(swipeText, 0, {swipe_id: target, refresh:'display_and_render_current'});
      } else if (typeof first.setSwipe === 'function'){
        first.setSwipe(target);
      }
    }catch(e){ console.warn('swipe 切换失败:', e); }
    finally{ nb.style.opacity='1'; nb.style.pointerEvents='auto'; }
  });
}

if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', initDossier);
} else {
  initDossier();
}
})();
</script>

</body>
</html>
