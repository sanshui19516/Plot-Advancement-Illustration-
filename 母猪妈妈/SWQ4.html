<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>生日的婚纱 · 抉择</title>

<style>
@import url("https://fontsapi.zeoseven.com/134/main/result.css");

:root {
    --wine: 352, 58%, 32%;
    --wine-deep: 352, 50%, 18%;
    --amber: 38, 62%, 48%;
    --amber-soft: 38, 50%, 62%;
    --char: 0, 0%, 5%;
    --ink: 35, 20%, 88%;
    --ink-dim: 35, 12%, 55%;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: "LXGW Marker Gothic", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-weight: normal;
    background: transparent;
}

/* ========== 外壳：像夹在病历里的一页处方笺 ========== */
.rx {
    max-width: 600px;
    margin: 1.2rem auto;
    position: relative;
    border-radius: 4px 20px 4px 20px;
    background:
        linear-gradient(170deg, hsla(var(--char-card, 0 0% 8%), 0.94), hsla(var(--char), 0.97)),
        radial-gradient(ellipse at 90% 10%, hsla(var(--wine), 0.15), transparent 55%);
    backdrop-filter: blur(20px) saturate(1.3);
    -webkit-backdrop-filter: blur(20px) saturate(1.3);
    border: 1px solid hsla(var(--amber), 0.15);
    box-shadow:
        0 16px 50px rgba(0,0,0,0.5),
        inset 0 1px 0 hsla(var(--amber), 0.07);
    padding: 14px 14px 13px;
    overflow: hidden;
}

/* 左侧一条暗红书脊，像处方本装订边 */
.rx::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
    background: linear-gradient(180deg, hsla(var(--wine), 0.7), hsla(var(--wine-deep), 0.9), hsla(var(--wine), 0.6));
    pointer-events: none;
}
/* 斜纹纸纹 */
.rx::after {
    content: '';
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(
        45deg,
        hsla(var(--amber), 0.018) 0px,
        hsla(var(--amber), 0.018) 1px,
        transparent 1px,
        transparent 10px
    );
    pointer-events: none;
}
.rx > * { position: relative; z-index: 1; }

/* ========== 抬头 ========== */
.rx-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 2px 10px;
    border-bottom: 1px dashed hsla(var(--amber), 0.13);
    margin-bottom: 12px;
}
.rx-title {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; letter-spacing: 4px;
    color: hsla(var(--amber-soft), 0.95);
    text-shadow: 0 0 16px hsla(var(--amber), 0.18);
}
.rx-title svg {
    width: 15px; height: 15px;
    fill: none; stroke: hsla(var(--amber), 0.6);
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
}
.rx-stamp {
    font-size: 9px; letter-spacing: 2px;
    color: hsla(var(--wine), 0.75);
    border: 1px solid hsla(var(--wine), 0.35);
    border-radius: 3px;
    padding: 2px 6px;
    transform: rotate(-3deg);
    opacity: 0.85;
}

/* ========== 选项：纸签堆叠 ========== */
.rx-list {
    display: flex; flex-direction: column; gap: 9px;
}

.ticket {
    position: relative;
    display: flex; align-items: center; gap: 11px;
    width: 100%;
    text-align: left;
    padding: 11px 13px 11px 11px;
    background: hsla(var(--char-card, 0 0% 8%), 0.55);
    border: 1px solid hsla(var(--amber), 0.09);
    border-left: 2px solid hsla(var(--wine), 0.4);
    border-radius: 2px 12px 2px 12px;
    color: hsla(var(--ink), 0.9);
    font-family: inherit;
    font-size: 13px;
    font-weight: 450;
    line-height: 1.5;
    cursor: pointer;
    transition: all .28s cubic-bezier(.25,.8,.25,1);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overflow: hidden;
}
/* 纸签右侧的细齿边 */
.ticket::before {
    content: '';
    position: absolute; right: 0; top: 0; bottom: 0; width: 8px;
    background-image: radial-gradient(circle at 8px 50%, hsla(var(--char),1) 2px, transparent 2.5px);
    background-size: 8px 10px;
    background-repeat: repeat-y;
    opacity: 0.9;
    pointer-events: none;
}

.ticket:hover {
    background: hsla(var(--wine-deep), 0.35);
    border-left-color: hsla(var(--amber), 0.75);
    border-color: hsla(var(--amber), 0.2);
    transform: translateX(3px) rotate(-0.4deg);
    box-shadow: 0 6px 22px rgba(0,0,0,0.35);
    color: hsla(var(--ink), 1);
}
.ticket:hover .seal { border-color: hsla(var(--amber), 0.6); color: hsla(var(--amber-soft), 0.95); transform: rotate(0deg); }

.ticket:active { transform: scale(.97) translateX(1px); transition-duration: .06s; }
.ticket.disabled { opacity: .3; pointer-events: none; }

/* 序号：印章感 */
.seal {
    flex-shrink: 0;
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid hsla(var(--wine), 0.5);
    border-radius: 50%;
    color: hsla(var(--wine), 0.85);
    font-size: 12px; font-weight: 700;
    transform: rotate(-6deg);
    transition: all .28s ease;
    text-shadow: 0 0 8px hsla(var(--wine), 0.25);
}
.ticket .label { flex: 1; min-width: 0; word-break: break-word; }

/* 悬停时右侧浮现的小箭头 */
.ticket .arrow {
    flex-shrink: 0; width: 14px; height: 14px;
    fill: none; stroke: hsla(var(--amber), 0.15);
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    transition: all .28s ease;
}
.ticket:hover .arrow { stroke: hsla(var(--amber), 0.7); transform: translateX(2px); }

/* 空态 */
.empty {
    text-align: center; padding: 14px 0;
    font-size: 11px; letter-spacing: 3px;
    color: hsla(var(--ink-dim), 0.3);
}

/* 底部小字 */
.rx-foot {
    margin-top: 11px; padding-top: 8px;
    border-top: 1px dashed hsla(var(--amber), 0.08);
    display: flex; justify-content: space-between; align-items: center;
    font-size: 9px; letter-spacing: 1px;
    color: hsla(var(--ink-dim), 0.4);
}
.rx-foot .dots { display: flex; gap: 4px; }
.rx-foot .dots i {
    width: 4px; height: 4px; border-radius: 50%;
    background: hsla(var(--amber), 0.18);
    animation: flick 2.4s ease-in-out infinite;
}
.rx-foot .dots i:nth-child(2) { animation-delay: .4s; }
.rx-foot .dots i:nth-child(3) { animation-delay: .8s; }
@keyframes flick { 0%,100%{opacity:.2} 50%{opacity:.85; box-shadow:0 0 6px hsla(var(--amber),0.5)} }

/* 响应式 */
@media (max-width: 460px) {
    .rx { padding: 12px 10px 11px; margin: .9rem auto; }
    .rx-title { font-size: 11px; letter-spacing: 3px; }
    .ticket { font-size: 12px; padding: 10px 11px 10px 9px; gap: 9px; }
    .seal { width: 23px; height: 23px; font-size: 11px; }
}
@media (min-width: 640px) {
    .rx { max-width: 640px; padding: 18px 16px 15px; }
    .ticket { font-size: 14px; padding: 13px 15px 13px 13px; }
    .seal { width: 28px; height: 28px; }
}

/* 入场 */
.rx { animation: in .55s cubic-bezier(.25,.8,.25,1) both; }
@keyframes in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="rx" id="rxRoot">
    <div class="rx-head">
        <div class="rx-title">
            <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            抉择
        </div>
        <div class="rx-stamp">处方笺</div>
    </div>

    <div class="rx-list" id="rxList"></div>

    <div class="rx-foot">
        <span>✦ 点选一项推进剧情 ✦</span>
        <span class="dots"><i></i><i></i><i></i></span>
    </div>
</div>

<!-- 外链适配：数据容器 -->
<div id="options-data" style="display:none;">$1</div>

<script>
(function(){
'use strict';

/* 从隐藏容器读数据，不直接读 '$1' */
var dataEl = document.getElementById('options-data');
var raw = dataEl ? (dataEl.textContent || '').trim() : '';

var list = document.getElementById('rxList');
if (!list) return;

/* 发送选项 */
function send(text){
    if (!text) return;
    if (typeof triggerSlash === 'function'){
        triggerSlash('/send ' + text + '|/trigger');
        return;
    }
    var ta = document.querySelector('#send_textarea') ||
             (window.parent && window.parent.document.querySelector('#send_textarea'));
    if (ta){
        ta.value = text;
        ta.dispatchEvent(new Event('input', { bubbles: true }));
        var btn = document.querySelector('#send_button') || document.querySelector('#send_btn');
        if (btn) setTimeout(function(){ btn.click(); }, 80);
    }
}

/* 解析 */
var items = raw ? raw.split('|').map(function(s){ return s.trim(); }).filter(function(s){ return s.length > 0; }) : [];

if (items.length === 0){
    list.innerHTML = '<div class="empty">✦ 等待抉择 ✦</div>';
    return;
}

/* 渲染：序号用印章体圈字 */
var seals = ['壹','贰','叁','肆','伍','陆','柒','捌','玖','拾'];
var html = '';
items.forEach(function(opt, i){
    var safe = opt.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    var seal = seals[i] || (i+1);
    html += '<button class="ticket" data-opt="' + safe + '">' +
              '<span class="seal">' + seal + '</span>' +
              '<span class="label">' + safe + '</span>' +
              '<svg class="arrow" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>' +
            '</button>';
});
list.innerHTML = html;

/* 点击 */
list.addEventListener('click', function(e){
    var t = e.target.closest('.ticket');
    if (!t || t.classList.contains('disabled')) return;
    var text = t.getAttribute('data-opt');
    if (!text) return;
    list.querySelectorAll('.ticket').forEach(function(b){ b.classList.add('disabled'); });
    send(text);
    setTimeout(function(){
        list.querySelectorAll('.ticket').forEach(function(b){ b.classList.remove('disabled'); });
    }, 5000);
});

/* 触屏反馈 */
list.addEventListener('touchstart', function(e){
    var t = e.target.closest('.ticket');
    if (!t) return;
    t.style.transition = 'none';
    t.style.transform = 'scale(.96)';
    setTimeout(function(){ t.style.transition = ''; t.style.transform = ''; }, 100);
}, { passive: true });

})();
</script>

</body>
</html>
