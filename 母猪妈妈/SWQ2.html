<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>生日的婚纱 · 请柬</title>
<style>
@import url("https://fontsapi.zeoseven.com/134/main/result.css");
:root{
  --wine:352,58%,32%;
  --wine-deep:352,50%,18%;
  --amber:38,62%,48%;
  --amber-soft:38,50%,62%;
  --char:0,0%,5%;
  --char-card:0,0%,9%;
  --ink:35,20%,88%;
  --ink-dim:35,12%,55%;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:"LXGW Marker Gothic","PingFang SC","Microsoft YaHei",sans-serif;
  font-weight:normal;
  background:transparent;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:16px;
}
.invite{
  position:relative;
  width:100%;max-width:540px;
  background:
    linear-gradient(160deg,hsla(var(--char-card),0.95),hsla(var(--char),0.98)),
    radial-gradient(ellipse at 20% 10%,hsla(var(--wine),0.2),transparent 55%);
  backdrop-filter:blur(24px) saturate(1.3);
  -webkit-backdrop-filter:blur(24px) saturate(1.3);
  border-radius:6px 28px 6px 28px;
  border:1px solid hsla(var(--amber),0.16);
  box-shadow:0 24px 70px rgba(0,0,0,0.6),inset 0 1px 0 hsla(var(--amber),0.08);
  overflow:hidden;
  animation:up .8s cubic-bezier(.25,.8,.25,1) both;
}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.invite::before{
  content:'';position:absolute;inset:0;
  background-image:repeating-linear-gradient(45deg,hsla(var(--amber),0.015) 0,hsla(var(--amber),0.015) 1px,transparent 1px,transparent 10px);
  pointer-events:none;
}
.invite::after{
  content:'';position:absolute;right:-30%;top:-20%;width:80%;height:60%;
  background:radial-gradient(ellipse,hsla(var(--wine),0.14),transparent 65%);
  pointer-events:none;
  animation:drift 14s ease-in-out infinite alternate;
}
@keyframes drift{0%{transform:translate(0,0) scale(1);opacity:.5}100%{transform:translate(-8%,6%) scale(1.15);opacity:.9}}
.invite>*{position:relative;z-index:1;}

/* 双线框标题 */
.invite-head{padding:26px 22px 14px;text-align:center;}
.frame{
  position:relative;padding:18px 20px;
  border:1px solid hsla(var(--amber),0.22);
  border-radius:2px;
}
.frame::before{
  content:'';position:absolute;inset:5px;
  border:1px solid hsla(var(--amber),0.1);
  border-radius:1px;pointer-events:none;
}
.frame .corner{position:absolute;width:10px;height:10px;border-color:hsla(var(--amber),0.5);}
.corner.tl{top:-1px;left:-1px;border-top:2px solid;border-left:2px solid;}
.corner.tr{top:-1px;right:-1px;border-top:2px solid;border-right:2px solid;}
.corner.bl{bottom:-1px;left:-1px;border-bottom:2px solid;border-left:2px solid;}
.corner.br{bottom:-1px;right:-1px;border-bottom:2px solid;border-right:2px solid;}

.main-title{
  font-size:clamp(24px,7vw,34px);font-weight:700;
  letter-spacing:8px;color:hsla(var(--ink),1);
  text-shadow:0 0 30px hsla(var(--wine),0.4),0 2px 4px rgba(0,0,0,0.6);
  margin-bottom:6px;
}
.sub-title{
  font-size:clamp(10px,2.4vw,12px);letter-spacing:6px;
  color:hsla(var(--amber-soft),0.7);font-style:italic;
}
.deco-line{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:10px;}
.deco-line span{width:40px;height:1px;background:linear-gradient(90deg,transparent,hsla(var(--amber),0.4),transparent);}
.deco-line .dot{width:4px;height:4px;border-radius:50%;background:hsla(var(--amber),0.5);box-shadow:0 0 8px hsla(var(--amber),0.4);}

/* 散落照片 */
.photo-stack{position:relative;height:250px;margin:0 22px 16px;}
.photo-stack .p{
  position:absolute;border-radius:3px;overflow:hidden;
  border:2px solid hsla(var(--char),0.9);
  box-shadow:0 10px 30px rgba(0,0,0,0.55),0 0 0 1px hsla(var(--amber),0.15);
  transition:all .5s cubic-bezier(.25,.8,.25,1);
  cursor:pointer;
}
.photo-stack .p img{width:100%;height:100%;object-fit:cover;display:block;}
.p1{width:44%;height:78%;left:1%;top:8%;transform:rotate(-7deg);z-index:1;}
.p2{width:44%;height:82%;left:28%;top:2%;transform:rotate(2deg);z-index:2;}
.p3{width:40%;height:72%;right:0%;top:14%;transform:rotate(6deg);z-index:3;}
.photo-stack .p:hover{transform:rotate(0) scale(1.06);z-index:10;}

/* 打字机引子 */
.story-wrap{
  margin:0 22px 16px;padding:14px 16px;
  background:hsla(var(--char),0.4);
  border-left:2px solid hsla(var(--wine),0.5);
  border-radius:0 6px 6px 0;min-height:110px;
}
.story-label{
  font-size:9px;letter-spacing:3px;color:hsla(var(--amber),0.4);
  margin-bottom:8px;display:flex;align-items:center;gap:6px;
}
.story-label svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.8;}
.story-text{font-size:12px;line-height:1.95;color:hsla(var(--ink),0.82);letter-spacing:0.3px;min-height:64px;}
.story-text .cursor{
  display:inline-block;width:2px;height:1em;background:hsla(var(--amber),0.8);
  margin-left:2px;vertical-align:text-bottom;animation:blink 1s step-end infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* 蜡封按钮 */
.btn-wrap{padding:6px 22px 26px;display:flex;justify-content:center;}
.wax-btn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:12px;
  padding:14px 38px;min-width:230px;
  background:linear-gradient(135deg,hsla(var(--wine),0.55),hsla(var(--wine-deep),0.78));
  border:1px solid hsla(var(--amber),0.35);
  border-radius:60px;
  color:hsla(var(--ink),1);font-family:inherit;
  font-size:14px;font-weight:600;letter-spacing:6px;
  cursor:pointer;transition:all .35s cubic-bezier(.25,.8,.25,1);
  box-shadow:0 6px 20px rgba(0,0,0,0.4),inset 0 1px 0 hsla(var(--amber),0.2),inset 0 -2px 6px hsla(var(--wine-deep),0.5);
  overflow:hidden;
}
.wax-btn::before{content:'';position:absolute;inset:3px;border:1px solid hsla(var(--amber),0.15);border-radius:60px;pointer-events:none;}
.wax-btn::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,hsla(var(--amber),0.15),transparent 60%);pointer-events:none;}
.wax-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 30px rgba(0,0,0,0.5),inset 0 1px 0 hsla(var(--amber),0.3),inset 0 -2px 8px hsla(var(--wine-deep),0.6);
  border-color:hsla(var(--amber),0.6);
}
.wax-btn:active{transform:scale(.97);transition-duration:.06s;}
.wax-btn svg{width:16px;height:16px;fill:none;stroke:hsla(var(--amber-soft),0.7);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

@media (max-width:460px){
  body{padding:10px;}
  .invite{border-radius:4px 20px 4px 20px;}
  .invite-head{padding:20px 14px 10px;}
  .main-title{letter-spacing:5px;}
  .photo-stack{height:210px;margin:0 14px 12px;}
  .story-wrap{margin:0 14px 12px;padding:12px;}
  .btn-wrap{padding:4px 14px 20px;}
  .wax-btn{padding:12px 26px;font-size:12px;letter-spacing:4px;min-width:180px;}
}
</style>
</head>
<body>

<div class="invite">
  <div class="invite-head">
    <div class="frame">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
      <div class="main-title">生日的婚纱</div>
      <div class="sub-title">—— 沈晚棠 · 请柬 ——</div>
      <div class="deco-line"><span></span><i class="dot"></i><span></span></div>
    </div>
  </div>

  <div class="photo-stack">
    <div class="p p1"><img src="https://testingcf.jsdelivr.net/gh/sanshui19516/Plot-Advancement-Illustration-@main/%E6%AF%8D%E7%8C%AA%E5%A6%88%E5%A6%88/%E6%B2%88%E6%99%9A%E6%A3%A0%20(1).jpg" alt="" /></div>
    <div class="p p2"><img src="https://testingcf.jsdelivr.net/gh/sanshui19516/Plot-Advancement-Illustration-@main/%E6%AF%8D%E7%8C%AA%E5%A6%88%E5%A6%88/%E6%B2%88%E6%99%9A%E6%A3%A0%20(2).jpg" alt="" /></div>
    <div class="p p3"><img src="https://testingcf.jsdelivr.net/gh/sanshui19516/Plot-Advancement-Illustration-@main/%E6%AF%8D%E7%8C%AA%E5%A6%88%E5%A6%88/%E6%B2%88%E6%99%9A%E6%A3%A0%20(3).jpg" alt="" /></div>
  </div>

  <div class="story-wrap">
    <div class="story-label">
      <svg viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7"/><line x1="4" y1="10" x2="20" y2="10"/><line x1="4" y1="14" x2="20" y2="14"/><line x1="4" y1="18" x2="16" y2="18"/></svg>
      引子
    </div>
    <div class="story-text" id="storyText"></div>
  </div>

  <div class="btn-wrap">
    <button class="wax-btn" id="enterBtn">
      推门而入
      <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </button>
  </div>
</div>

<script>
(function(){
'use strict';

function initHomePage(){
  /* 打字机 */
  var lines = [
    '今天是他成年的生日。',
    '她穿上了那件白色婚纱，坐在二楼客厅里，没有开大灯。',
    '楼梯上传来脚步声——他回来了。'
  ];
  var tw = document.getElementById('storyText');
  if (tw){
    var full = lines.join('\n');
    var idx = 0;
    var cursor = '<span class="cursor"></span>';
    function type(){
      if (idx >= full.length){ tw.innerHTML = full.replace(/\n/g,'<br>') + cursor; return; }
      tw.innerHTML = full.slice(0, idx+1).replace(/\n/g,'<br>') + cursor;
      idx++;
      setTimeout(type, full.charAt(idx-1) === '\n' ? 240 : 30);
    }
    setTimeout(type, 500);
  }

  /* 按钮跳转 swipe 1 */
  var old = document.getElementById('enterBtn');
  if (!old) return;
  var nb = old.cloneNode(true);
  old.parentNode.replaceChild(nb, old);
  nb.addEventListener('click', async function(){
    nb.style.opacity = '0.5';
    nb.style.pointerEvents = 'none';
    try{
      var messages;
      try{ messages = await getChatMessages?.('0', {include_swipe:true}); }
      catch(_){ var ctx = window.SillyTavern?.getContext?.(); messages = ctx?.chat?.messages; }
      if (!messages || !messages.length) return;
      var first = messages[0];
      if (!first.swipes) return;
      var target = 1;
      if (first.swipes.length <= target) return;
      var swipeText = first.swipes[target];
      var setChatMessage = window.setChatMessage || window.SillyTavern?.getContext?.()?.setChatMessage;
      if (typeof setChatMessage === 'function'){
        await setChatMessage(swipeText, 0, {swipe_id: target, refresh:'display_and_render_current'});
      } else if (typeof first.setSwipe === 'function'){
        first.setSwipe(target);
      }
    }catch(e){ console.warn('swipe 切换失败:', e); }
    finally{ nb.style.opacity='1'; nb.style.pointerEvents='auto'; }
  });
}

if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', initHomePage);
} else {
  initHomePage();
}
})();
</script>

</body>
</html>
