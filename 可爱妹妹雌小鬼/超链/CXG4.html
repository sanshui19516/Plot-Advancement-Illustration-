<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>选项栏 · 兄妹日记</title>
<style>
@font-face {
  font-family: "ZSFT-ga";
  src: url("https://fontsapi.zeoseven.com/ga/main.woff2") format("woff2");
  font-style: normal;
  font-weight: 400;
  font-display: swap;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --rose: hsl(340, 72%, 66%);
  --rose-light: hsl(340, 78%, 82%);
  --rose-deep: hsl(340, 55%, 48%);
  --wine: hsl(345, 58%, 42%);
  --wine-dark: hsl(345, 62%, 26%);
  --leather: hsl(340, 22%, 11%);
  --leather-dark: hsl(340, 25%, 5%);
  --paper-pink: hsl(340, 50%, 96%);
  --ink: hsl(340, 18%, 20%);
  --ink-light: hsl(340, 12%, 48%);
  --gold: hsl(35, 58%, 62%);
  --gold-deep: hsl(35, 48%, 44%);
  --blur: 16px;
  --radius: 16px;
  --font: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
  --font-serif: "ZSFT-ga", "Georgia", "Times New Roman", serif;
}

body {
  width: 100%;
  background: transparent;
  font-family: var(--font);
  padding: 10px 0;
}

/* ============================================================
   容器
   ============================================================ */
.options-wrap {
  width: 100%;
  max-width: 580px;
  margin: 0 auto;
  position: relative;
  filter: drop-shadow(0 12px 32px rgba(0, 0, 0, 0.5));
  animation: wrapEnter 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  opacity: 0;
  transform: translateY(15px);
}

@keyframes wrapEnter {
  0% { opacity: 0; transform: translateY(15px); }
  100% { opacity: 1; transform: translateY(0); }
}

/* 皮革封面 */
.options-cover {
  border-radius: 20px;
  padding: 8px;
  position: relative;
  background:
    radial-gradient(ellipse at 25% 0%, hsl(340, 28%, 14%) 0%, transparent 55%),
    radial-gradient(ellipse at 75% 100%, hsl(345, 32%, 9%) 0%, transparent 55%),
    linear-gradient(145deg, var(--leather) 0%, var(--leather-dark) 100%);
  border: 1px solid hsl(340, 32%, 18%);
  box-shadow:
    inset 0 1px 0 hsl(340, 32%, 22%),
    inset 0 -2px 10px rgba(0, 0, 0, 0.5);
  overflow: hidden;
}

/* 缝线 */
.options-cover::before {
  content: '';
  position: absolute;
  inset: 3px;
  border-radius: 17px;
  border: 1px dashed hsl(340, 42%, 34%);
  opacity: 0.5;
  pointer-events: none;
  z-index: 2;
}

/* 丝袜暗纹 */
.options-cover::after {
  content: '';
  position: absolute;
  inset: 8px;
  border-radius: 13px;
  background-image:
    repeating-linear-gradient(45deg, transparent 0 10px, hsla(340, 60%, 60%, 0.035) 10px 11px),
    repeating-linear-gradient(-45deg, transparent 0 10px, hsla(340, 60%, 60%, 0.035) 10px 11px);
  pointer-events: none;
  z-index: 1;
}

/* ============================================================
   顶部标题栏
   ============================================================ */
.options-header {
  position: relative;
  z-index: 3;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px 8px;
  border-bottom: 1px solid hsla(340, 50%, 30%, 0.35);
}

.options-title {
  font-family: var(--font-serif);
  font-size: 13px;
  font-weight: 400;
  color: var(--rose-light);
  letter-spacing: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
  text-shadow: 0 0 12px hsla(345, 60%, 50%, 0.35);
}

.options-title::before {
  content: '❦';
  color: var(--gold);
  opacity: 0.85;
  font-size: 12px;
}

.options-hint {
  font-size: 9.5px;
  color: hsla(345, 40%, 70%, 0.5);
  letter-spacing: 1.5px;
  font-style: italic;
  display: flex;
  align-items: center;
  gap: 4px;
}

.options-hint::before {
  content: '';
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--rose);
  opacity: 0.6;
  box-shadow: 0 0 6px var(--rose);
  animation: hintPulse 2s ease-in-out infinite;
}

@keyframes hintPulse {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

/* ============================================================
   选项列表
   ============================================================ */
.options-list {
  position: relative;
  z-index: 3;
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding: 12px 12px 14px;
}

/* 单个选项 = 便签条 */
.opt-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  border-radius: var(--radius);
  cursor: pointer;
  position: relative;
  transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  background:
    linear-gradient(135deg, hsla(345, 50%, 24%, 0.9) 0%, hsla(345, 40%, 16%, 0.95) 100%);
  border: 1px solid hsla(345, 50%, 40%, 0.35);
  backdrop-filter: blur(var(--blur)) saturate(1.4);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(1.4);
  overflow: hidden;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* 便签左侧色带 */
.opt-item::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: linear-gradient(180deg, var(--rose) 0%, var(--wine) 100%);
  box-shadow: 0 0 12px var(--rose-deep);
  transition: width 0.28s;
}

/* 便签右上角装饰折角 */
.opt-item::after {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  width: 16px;
  height: 16px;
  background: linear-gradient(225deg, hsla(345, 45%, 32%, 0.8) 50%, transparent 50%);
  transition: all 0.3s;
}

/* 悬停 */
.opt-item:hover {
  background: linear-gradient(135deg, hsla(345, 55%, 28%, 0.95) 0%, hsla(345, 45%, 20%, 0.98) 100%);
  border-color: var(--rose);
  transform: translateX(3px) translateY(-1px);
  box-shadow:
    0 6px 20px rgba(120, 30, 70, 0.35),
    0 0 30px hsla(345, 65%, 55%, 0.12),
    inset 0 1px 0 hsla(345, 60%, 70%, 0.1);
}

.opt-item:hover::before {
  width: 4px;
  box-shadow: 0 0 18px var(--rose);
}

.opt-item:hover::after {
  width: 18px;
  height: 18px;
}

/* 按下 */
.opt-item:active {
  transform: translateX(1px) translateY(0) scale(0.985);
  transition-duration: 0.08s;
}

/* 禁用状态 */
.opt-item.disabled {
  opacity: 0.35;
  pointer-events: none;
  transform: none !important;
}

/* ============================================================
   编号（金色徽章）
   ============================================================ */
.opt-number {
  flex-shrink: 0;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-serif);
  font-size: 13px;
  font-weight: 700;
  color: var(--gold);
  background:
    radial-gradient(circle at 35% 30%, hsla(35, 60%, 55%, 0.25) 0%, hsla(35, 40%, 20%, 0.4) 80%);
  border: 1px solid hsla(35, 55%, 55%, 0.5);
  box-shadow:
    inset 0 0 8px hsla(35, 60%, 50%, 0.15),
    0 0 10px hsla(35, 50%, 40%, 0.12);
  transition: all 0.3s;
  text-shadow: 0 0 6px hsla(35, 60%, 55%, 0.4);
}

.opt-item:hover .opt-number {
  color: var(--rose-light);
  border-color: var(--rose);
  box-shadow:
    inset 0 0 10px hsla(345, 65%, 55%, 0.25),
    0 0 15px hsla(345, 65%, 55%, 0.3);
  background:
    radial-gradient(circle at 35% 30%, hsla(345, 60%, 55%, 0.3) 0%, hsla(345, 40%, 20%, 0.5) 80%);
  transform: scale(1.08);
}

/* ============================================================
   文字
   ============================================================ */
.opt-text {
  flex: 1;
  min-width: 0;
  font-size: 13px;
  line-height: 1.5;
  color: hsla(345, 25%, 88%, 1);
  letter-spacing: 0.3px;
  font-weight: 450;
  transition: color 0.28s;
  word-break: break-word;
}

.opt-item:hover .opt-text {
  color: var(--paper-pink);
  text-shadow: 0 0 15px hsla(345, 60%, 55%, 0.25);
}

/* 右侧箭头指示 */
.opt-arrow {
  flex-shrink: 0;
  width: 12px;
  height: 12px;
  opacity: 0.3;
  transition: all 0.28s;
}

.opt-arrow svg {
  width: 100%;
  height: 100%;
  stroke: var(--rose-light);
  fill: none;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.opt-item:hover .opt-arrow {
  opacity: 0.9;
  transform: translateX(2px);
}

/* ============================================================
   空状态
   ============================================================ */
.options-empty {
  padding: 24px 16px;
  text-align: center;
  color: hsla(345, 40%, 70%, 0.35);
  font-size: 11px;
  letter-spacing: 2px;
  font-style: italic;
  font-family: var(--font-serif);
}

/* ============================================================
   响应式
   ============================================================ */
@media (max-width: 460px) {
  .options-wrap { max-width: 100%; }
  .options-cover { padding: 6px; border-radius: 16px; }
  .options-header { padding: 8px 10px 7px; }
  .options-title { font-size: 11px; letter-spacing: 3px; }
  .options-hint { font-size: 8.5px; }
  .options-list { padding: 10px 9px 12px; gap: 6px; }
  .opt-item { padding: 10px 12px; gap: 8px; border-radius: 13px; }
  .opt-number { width: 22px; height: 22px; font-size: 12px; }
  .opt-text { font-size: 12px; }
}

@media (min-width: 600px) {
  .options-wrap { max-width: 620px; }
  .opt-text { font-size: 14px; }
  .opt-item { padding: 13px 16px; }
}

@media (min-width: 900px) {
  .options-wrap { max-width: 660px; }
}
</style>
</head>
<body>

<div class="options-wrap" id="options-root">
  <div class="options-cover">
    <div class="options-header">
      <span class="options-title">選択 · 选 择</span>
      <span class="options-hint">点击行动</span>
    </div>
    <div class="options-list" id="options-list"></div>
  </div>
</div>

<!-- ============================================================
     外链数据容器（外链模式专用）
     外链加载器会把捕获到的实际数据注入到这里
     ============================================================ -->
<div id="options-data" style="display:none;">$1</div>

<script>
(function() {
  'use strict';

  /* ============================================================
     读取数据
     外链模式：从 #options-data 隐藏容器读取
     内联模式：如果直接嵌入，这里会是 $1 字面量
     ============================================================ */
  var dataContainer = document.getElementById('options-data');
  var raw = dataContainer ? (dataContainer.textContent || '').trim() : '';

  var container = document.getElementById('options-list');
  if (!container) return;

  /* ============================================================
     发送到酒馆输入框
     ============================================================ */
  function sendOption(text) {
    if (!text) return;

    /* 优先使用酒馆原生 slash 触发 */
    if (typeof triggerSlash === 'function') {
      triggerSlash('/send ' + text + '|/trigger');
      return;
    }

    /* 兜底：DOM 操作 */
    var textarea = document.querySelector('#send_textarea') ||
      (window.parent && window.parent.document.querySelector('#send_textarea'));
    if (textarea) {
      textarea.value = text;
      textarea.dispatchEvent(new Event('input', { bubbles: true }));

      var sendBtn = document.querySelector('#send_button') ||
                    document.querySelector('#send_btn') ||
                    (window.parent && window.parent.document.querySelector('#send_button'));
      if (sendBtn) {
        setTimeout(function() { sendBtn.click(); }, 80);
      }
    }
  }

  /* ============================================================
     解析数据（用 | 分隔）
     ============================================================ */
  var items = raw
    ? raw.split('|').map(function(s) { return s.trim(); }).filter(function(s) { return s.length > 0; })
    : [];

  if (items.length === 0) {
    container.innerHTML = '<div class="options-empty">✦ 等待命运的选择 ✦</div>';
    return;
  }

  /* ============================================================
     渲染选项
     ============================================================ */
  var numbers = ['Ⅰ', 'Ⅱ', 'Ⅲ', 'Ⅳ', 'Ⅴ'];
  var html = '';

  items.slice(0, 3).forEach(function(opt, index) {
    var safe = opt
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');

    var num = numbers[index] || (index + 1);

    html +=
      '<div class="opt-item" data-opt="' + safe + '">' +
        '<span class="opt-number">' + num + '</span>' +
        '<span class="opt-text">' + safe + '</span>' +
        '<span class="opt-arrow"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></span>' +
      '</div>';
  });

  container.innerHTML = html;

  /* ============================================================
     点击事件
     ============================================================ */
  container.addEventListener('click', function(e) {
    var btn = e.target.closest('.opt-item');
    if (!btn || btn.classList.contains('disabled')) return;

    var text = btn.getAttribute('data-opt');
    if (!text) return;

    /* 禁用所有按钮防连点 */
    var allBtns = container.querySelectorAll('.opt-item');
    for (var i = 0; i < allBtns.length; i++) {
      allBtns[i].classList.add('disabled');
    }

    sendOption(text);

    /* 5秒后恢复 */
    setTimeout(function() {
      var btns = container.querySelectorAll('.opt-item');
      for (var j = 0; j < btns.length; j++) {
        btns[j].classList.remove('disabled');
      }
    }, 5000);
  });

  /* ============================================================
     触摸反馈
     ============================================================ */
  container.addEventListener('touchstart', function(e) {
    var btn = e.target.closest('.opt-item');
    if (!btn) return;
    btn.style.transition = 'none';
    btn.style.transform = 'translateX(1px) scale(0.98)';
    setTimeout(function() {
      btn.style.transition = '';
      btn.style.transform = '';
    }, 100);
  }, { passive: true });

  console.log('[选项栏] 已加载，共 ' + items.length + ' 个选项');

})();
</script>

</body>
</html>
