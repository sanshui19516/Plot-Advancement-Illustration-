<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>夜窗 · 三重门</title>

<style>
/* ============================================================
   全局重置
   ============================================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: transparent;
  min-height: auto;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 16px 10px;
  font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --night-deep: hsl(232, 42%, 5%);
  --night-mid: hsl(232, 38%, 9%);
  --lzx-cold: hsl(205, 55%, 72%);
  --lzx-cold-dim: hsla(205, 55%, 72%, 0.25);
  --jt-warm: hsl(285, 45%, 72%);
  --jt-warm-dim: hsla(285, 45%, 72%, 0.25);
  --text-main: hsla(220, 20%, 92%, 0.92);
  --text-muted: hsla(220, 15%, 65%, 0.55);
  --text-dim: hsla(220, 15%, 55%, 0.4);
}

/* ============================================================
   主容器
   ============================================================ */
.options-arch {
  width: 100%;
  max-width: 540px;
  position: relative;
  border-radius: 22px;
  overflow: hidden;
  background: var(--night-deep);
  box-shadow:
    0 20px 60px rgba(0, 0, 0, 0.7),
    0 0 0 1px hsla(220, 30%, 70%, 0.06) inset,
    0 0 120px hsla(232, 50%, 40%, 0.06);
  padding: 18px 18px 16px;
}

.options-arch::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(1px 1px at 15% 20%, hsla(0,0%,100%,0.3), transparent),
    radial-gradient(1px 1px at 45% 8%, hsla(0,0%,100%,0.25), transparent),
    radial-gradient(1px 1px at 78% 22%, hsla(0,0%,100%,0.3), transparent),
    radial-gradient(1px 1px at 28% 75%, hsla(0,0%,100%,0.15), transparent),
    radial-gradient(1px 1px at 82% 68%, hsla(0,0%,100%,0.2), transparent);
  pointer-events: none;
  z-index: 0;
  animation: starDrift 25s linear infinite;
}
@keyframes starDrift {
  0% { opacity: 0.5; } 50% { opacity: 0.85; } 100% { opacity: 0.5; }
}

.options-arch::after {
  content: '';
  position: absolute;
  top: -20%; left: 50%;
  transform: translateX(-50%);
  width: 120%; height: 60%;
  background: radial-gradient(ellipse at 50% 100%, hsla(205, 50%, 60%, 0.06), transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* ============================================================
   顶栏
   ============================================================ */
.options-header {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 12px;
  margin-bottom: 14px;
  border-bottom: 1px solid hsla(220, 30%, 70%, 0.06);
}

.options-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 3px;
  color: hsla(220, 15%, 80%, 0.85);
  text-transform: uppercase;
}

.options-title .moon-mini {
  width: 14px; height: 14px;
  opacity: 0.6;
}
.options-title .moon-mini svg {
  width: 100%; height: 100%;
  stroke: var(--lzx-cold);
  fill: none;
  stroke-width: 1.5;
}

.options-hint {
  font-size: 10px;
  letter-spacing: 1px;
  color: var(--text-dim);
  font-family: "SF Mono", "Consolas", monospace;
}

/* ============================================================
   三扇拱门
   ============================================================ */
.arches-grid {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
}

.arch-option {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 18px 10px 20px;
  min-height: 140px;
  border-radius: 14px 14px 10px 10px;
  cursor: pointer;
  overflow: hidden;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  border: 1px solid hsla(220, 30%, 70%, 0.08);
  background: linear-gradient(180deg, hsla(232, 35%, 12%, 0.7) 0%, hsla(232, 42%, 7%, 0.9) 100%);
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.arch-option::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 50%;
  border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  background: linear-gradient(180deg, hsla(205, 40%, 60%, 0.06) 0%, transparent 100%);
  pointer-events: none;
}

.arch-light {
  position: absolute;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 80%;
  height: 0%;
  transition: height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  pointer-events: none;
}

.arch-index {
  position: relative;
  z-index: 2;
  font-family: "SF Mono", "Consolas", monospace;
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--text-dim);
  transition: color 0.35s ease;
}

.arch-glyph {
  position: relative;
  z-index: 2;
  width: 22px; height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.arch-glyph svg {
  width: 100%; height: 100%;
  fill: none;
  stroke: hsla(220, 20%, 70%, 0.4);
  stroke-width: 1.5;
  transition: stroke 0.35s ease;
}

.arch-text {
  position: relative;
  z-index: 2;
  font-size: 12px;
  line-height: 1.55;
  text-align: center;
  letter-spacing: 0.3px;
  color: hsla(220, 15%, 85%, 0.85);
  transition: color 0.35s ease;
  padding: 0 2px;
  word-break: break-word;
}

/* ============================================================
   悬停 / 激活状态
   ============================================================ */
.arch-option:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), 0 0 30px hsla(205, 55%, 72%, 0.08);
}

.arch-option:hover .arch-light { height: 100%; }
.arch-option:hover .arch-text { color: hsla(0, 0%, 100%, 0.95); }

.arch-option:nth-child(1) .arch-light {
  background: radial-gradient(ellipse at 50% 100%, hsla(205, 60%, 75%, 0.35), transparent 70%);
}
.arch-option:nth-child(2) .arch-light {
  background: radial-gradient(ellipse at 50% 100%, hsla(260, 45%, 75%, 0.35), transparent 70%);
}
.arch-option:nth-child(3) .arch-light {
  background: radial-gradient(ellipse at 50% 100%, hsla(285, 50%, 78%, 0.35), transparent 70%);
}

.arch-option:nth-child(1):hover { border-color: hsla(205, 55%, 72%, 0.4); }
.arch-option:nth-child(2):hover { border-color: hsla(260, 45%, 72%, 0.4); }
.arch-option:nth-child(3):hover { border-color: hsla(285, 45%, 72%, 0.4); }

.arch-option:nth-child(1):hover .arch-glyph svg { stroke: var(--lzx-cold); }
.arch-option:nth-child(2):hover .arch-glyph svg { stroke: hsl(260, 50%, 78%); }
.arch-option:nth-child(3):hover .arch-glyph svg { stroke: var(--jt-warm); }

.arch-option:nth-child(1):hover .arch-index { color: var(--lzx-cold); }
.arch-option:nth-child(2):hover .arch-index { color: hsl(260, 50%, 78%); }
.arch-option:nth-child(3):hover .arch-index { color: var(--jt-warm); }

.arch-option:active {
  transform: translateY(-1px) scale(0.97);
  transition-duration: 0.08s;
}

.arch-option.disabled {
  opacity: 0.3;
  pointer-events: none;
}

.options-empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 30px 20px;
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--text-dim);
  font-family: "SF Mono", "Consolas", monospace;
}

/* ============================================================
   响应式
   ============================================================ */
@media (max-width: 480px) {
  .options-arch { padding: 14px 12px 12px; border-radius: 18px; }
  .arch-option { min-height: 120px; padding: 14px 8px 16px; gap: 6px; }
  .arch-text { font-size: 11px; }
  .arch-index { font-size: 9px; }
  .arch-glyph { width: 18px; height: 18px; }
}

@media (max-width: 360px) {
  .arches-grid { grid-template-columns: 1fr; gap: 8px; }
  .arch-option {
    flex-direction: row;
    justify-content: flex-start;
    min-height: auto;
    padding: 12px 14px;
    gap: 12px;
    border-radius: 12px;
  }
  .arch-option::before { display: none; }
  .arch-text { text-align: left; }
}

@media (min-width: 640px) {
  .options-arch { max-width: 580px; }
  .arch-option { min-height: 160px; }
  .arch-text { font-size: 13px; }
}
</style>
</head>

<body>

<div class="options-arch" id="optionsRoot">

  <div class="options-header">
    <div class="options-title">
      <span class="moon-mini">
        <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </span>
      <span>选 择 你 的 行 动</span>
    </div>
    <span class="options-hint">click to proceed</span>
  </div>

  <div class="arches-grid" id="archesGrid">
    <div class="options-empty">✦ 等待行动选项 ✦</div>
  </div>

</div>

<!-- ============================================================
     ✅ 外链适配关键：数据隐藏容器
     ============================================================ -->
<div id="options-data" style="display:none;">$1</div>

<script>
/* ============================================================
   选项栏主逻辑 · 外链适配版
   ============================================================ */

(function() {
  'use strict';

  /* ============================================================
     ✅ 外链适配关键：从隐藏容器读取 $1 数据
     ============================================================ */
  var dataContainer = document.getElementById('options-data');
  var raw = dataContainer ? dataContainer.textContent.trim() : '';

  /* ============================================================
     发送选项到酒馆输入框
     ============================================================ */
  function sendOption(text) {
    if (!text) return;

    if (typeof triggerSlash === 'function') {
      triggerSlash('/send ' + text + '|/trigger');
      return;
    }

    var textarea = document.querySelector('#send_textarea') ||
      (window.parent && window.parent.document.querySelector('#send_textarea'));
    if (textarea) {
      textarea.value = text;
      textarea.dispatchEvent(new Event('input', { bubbles: true }));

      var sendBtn = document.querySelector('#send_button') ||
        document.querySelector('#send_btn');
      if (sendBtn) {
        setTimeout(function() { sendBtn.click(); }, 80);
      }
    }
  }

  /* ============================================================
     图标与序号
     ============================================================ */
  var GLYPHS = [
    '<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
    '<svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
    '<svg viewBox="0 0 24 24"><path d="M8 2h8l-1 12a3 3 0 0 1-6 0z"/><line x1="12" y1="17" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>'
  ];

  var INDEX_LABELS = ['①', '②', '③'];

  /* ============================================================
     渲染
     ============================================================ */
  function render() {
    var grid = document.getElementById('archesGrid');
    if (!grid) return;

    var items = raw ? raw.split('|').map(function(s) {
      return s.trim();
    }).filter(function(s) {
      return s.length > 0;
    }) : [];

    if (items.length === 0) {
      grid.innerHTML = '<div class="options-empty">✦ 等待行动选项 ✦</div>';
      return;
    }

    var top3 = items.slice(0, 3);

    var html = '';
    top3.forEach(function(text, index) {
      var safe = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');

      var glyph = GLYPHS[index] || GLYPHS[0];
      var label = INDEX_LABELS[index] || (index + 1);

      html += '<div class="arch-option" data-opt="' + safe + '">' +
        '<div class="arch-light"></div>' +
        '<div class="arch-index">' + label + '</div>' +
        '<div class="arch-glyph">' + glyph + '</div>' +
        '<div class="arch-text">' + safe + '</div>' +
      '</div>';
    });

    grid.innerHTML = html;

    var options = grid.querySelectorAll('.arch-option');
    options.forEach(function(el) {
      el.addEventListener('click', function() {
        if (el.classList.contains('disabled')) return;
        var text = el.getAttribute('data-opt');
        if (!text) return;

        options.forEach(function(o) { o.classList.add('disabled'); });
        sendOption(text);

        setTimeout(function() {
          options.forEach(function(o) { o.classList.remove('disabled'); });
        }, 5000);
      });

      el.addEventListener('touchstart', function() {
        el.style.transition = 'none';
        el.style.transform = 'scale(0.97)';
        setTimeout(function() {
          el.style.transition = '';
          el.style.transform = '';
        }, 100);
      }, { passive: true });
    });
  }

  /* ============================================================
     启动
     ============================================================ */
  function init() {
    render();

    /* 监听容器变化 —— 外链模式数据可能延迟注入 */
    var container = document.getElementById('options-data');
    if (container && typeof MutationObserver !== 'undefined') {
      var observer = new MutationObserver(function() {
        var newRaw = container.textContent.trim();
        if (newRaw && newRaw !== raw && newRaw !== '$1') {
          raw = newRaw;
          render();
        }
      });
      observer.observe(container, { childList: true, characterData: true, subtree: true });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  console.log('🌟 夜窗 · 三重门 选项栏已加载（外链适配版）');
})();
</script>

</body>
</html>
