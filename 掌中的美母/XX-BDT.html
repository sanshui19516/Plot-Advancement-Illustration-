<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>掌中的美母 · 选项栏</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ==========================================
       配色继承自状态栏（酒红 350 + 香槟金 42）
       ========================================== */
    :root {
        --primary-h: 42;
        --primary-s: 60%;
        --primary-l: 55%;
        --bg-h: 350;
        --bg-s: 18%;
        --bg-l: 10%;
        --text-light: hsl(42, 30%, 92%);
        --radius: 14px;
        --blur: 24px;
        --font: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
        background: transparent;
        padding: 12px;
        font-family: var(--font);
    }

    .options-module {
        width: 100%;
        max-width: 520px;
        margin: 0 auto;
        background: hsla(var(--bg-h), var(--bg-s), var(--bg-l), 0.9);
        backdrop-filter: blur(var(--blur)) saturate(1.3);
        -webkit-backdrop-filter: blur(var(--blur)) saturate(1.3);
        border-radius: 28px;
        border: 1px solid hsla(var(--primary-h), var(--primary-s), var(--primary-l), 0.12);
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
        padding: 16px 16px 14px;
        color: var(--text-light);
        position: relative;
        overflow: hidden;
        animation: fadeUp 0.5s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
    }

    .options-module::before {
        content: '';
        position: absolute;
        inset: -50%;
        background: radial-gradient(ellipse at 30% 20%, hsla(var(--primary-h), var(--primary-s), var(--primary-l), 0.06), transparent 60%);
        animation: shimmer 12s ease-in-out infinite alternate;
        pointer-events: none;
        z-index: 0;
    }
    @keyframes shimmer {
        0% { transform: translate(-5%, -5%) scale(1); opacity: 0.3; }
        100% { transform: translate(5%, 5%) scale(1.1); opacity: 0.7; }
    }
    @keyframes fadeUp {
        0% { opacity: 0; transform: translateY(20px); }
        100% { opacity: 1; transform: translateY(0); }
    }

    .options-module > * { position: relative; z-index: 1; }

    .options-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 12px;
        border-bottom: 1px solid hsla(var(--primary-h), var(--primary-s), var(--primary-l), 0.1);
        margin-bottom: 14px;
    }

    .options-title {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 2px;
        color: hsl(var(--primary-h), var(--primary-s), 65%);
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .options-title svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .options-hint {
        font-size: 11px;
        color: hsla(var(--primary-h), var(--primary-s), var(--primary-l), 0.5);
        display: flex;
        align-items: center;
        gap: 4px;
    }
    .options-hint svg {
        width: 13px;
        height: 13px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .options-inner {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        padding: 2px 0;
    }

    .opt-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 14px 10px;
        background: hsla(var(--bg-h), var(--bg-s), calc(var(--bg-l) + 6%), 0.6);
        border: 1px solid hsla(var(--primary-h), var(--primary-s), var(--primary-l), 0.12);
        border-radius: var(--radius);
        color: var(--text-light);
        font-size: 13px;
        font-weight: 500;
        line-height: 1.5;
        text-align: center;
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        gap: 6px;
        position: relative;
        font-family: inherit;
    }

    .opt-btn .badge {
        display: block;
        font-size: 12px;
        font-weight: 700;
        color: hsla(var(--primary-h), var(--primary-s), var(--primary-l), 0.4);
        letter-spacing: 0.5px;
        transition: color 0.3s ease;
    }

    .opt-btn:hover {
        background: hsla(var(--primary-h), var(--primary-s), var(--primary-l), 0.08);
        border-color: hsla(var(--primary-h), var(--primary-s), var(--primary-l), 0.35);
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3), 0 0 30px hsla(var(--primary-h), var(--primary-s), var(--primary-l), 0.08);
    }
    .opt-btn:hover .badge {
        color: hsl(var(--primary-h), var(--primary-s), 65%);
    }

    .opt-btn:active {
        transform: scale(0.94) translateY(0);
        transition-duration: 0.05s;
    }

    .opt-btn.disabled {
        opacity: 0.35;
        pointer-events: none;
        transform: none !important;
    }

    .options-empty {
        color: hsla(var(--primary-h), var(--primary-s), var(--primary-l), 0.3);
        font-size: 12px;
        letter-spacing: 1px;
        text-align: center;
        width: 100%;
        padding: 14px 0;
        grid-column: 1 / -1;
    }

    @media (max-width: 520px) {
        .options-inner { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 440px) {
        .options-module { padding: 14px 12px 12px; border-radius: 22px; }
        .options-inner { grid-template-columns: 1fr; }
        .opt-btn {
            flex-direction: row;
            justify-content: flex-start;
            padding: 12px 16px;
            text-align: left;
        }
        .opt-btn .badge { margin-right: 10px; }
        .options-title { font-size: 12px; }
        .options-hint { font-size: 10px; }
    }

    @media (min-width: 600px) {
        .options-module { max-width: 560px; padding: 20px 18px 16px; }
        .opt-btn { padding: 16px 12px; font-size: 14px; }
    }
</style>
</head>
<body>

<div class="options-module" id="options-root">
    <div class="options-header">
        <div class="options-title">
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
            选择你的行动
        </div>
        <div class="options-hint">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12.01" y2="16"/><line x1="12" y1="12" x2="12" y2="8"/></svg>
            点击触发
        </div>
    </div>

    <div class="options-inner" id="options-list"></div>
</div>

<script>
(function() {
    'use strict';

    // ============================================================
    // 数据读取：兼容内联模式和外链模式
    // ============================================================
    var dataContainer = document.getElementById('options-data');
    var raw = dataContainer ? dataContainer.textContent.trim() : '$1'.trim();

    var container = document.getElementById('options-list');
    if (!container) return;

    function sendOption(text) {
        if (!text) return;

        if (typeof triggerSlash === 'function') {
            triggerSlash('/send ' + text + '|/trigger');
            return;
        }

        var textarea = document.querySelector('#send_textarea') ||
            (window.parent && window.parent.document.querySelector('#send_textarea'));
        if (textarea) {
            textarea.value = text;
            textarea.dispatchEvent(new Event('input', { bubbles: true }));

            var sendBtn = document.querySelector('#send_button') ||
                document.querySelector('#send_btn');
            if (sendBtn) {
                setTimeout(function() { sendBtn.click(); }, 80);
            }
        }
    }

    var items = raw ? raw.split('|').map(function(s) {
        return s.trim();
    }).filter(function(s) {
        return s.length > 0;
    }) : [];

    if (items.length === 0) {
        container.innerHTML = '<div class="options-empty">✦ 等待行动选项 ✦</div>';
        return;
    }

    var html = '';
    var badges = ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧', '⑨', '⑩'];

    items.forEach(function(opt, index) {
        if (index >= 3) return;

        var safeText = opt
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');

        var badgeText = badges[index] || (index + 1);

        html += '<button class="opt-btn" data-opt="' + safeText + '">' +
                '<span class="badge">' + badgeText + '</span>' +
                '<span>' + safeText + '</span>' +
                '</button>';
    });

    container.innerHTML = html;

    container.addEventListener('click', function(e) {
        var btn = e.target.closest('.opt-btn');
        if (!btn || btn.classList.contains('disabled')) return;

        var text = btn.getAttribute('data-opt');
        if (text) {
            var allBtns = document.querySelectorAll('.opt-btn');
            allBtns.forEach(function(b) { b.classList.add('disabled'); });

            sendOption(text);

            setTimeout(function() {
                var allBtns2 = document.querySelectorAll('.opt-btn');
                allBtns2.forEach(function(b) { b.classList.remove('disabled'); });
            }, 5000);
        }
    });

    container.addEventListener('touchstart', function(e) {
        var btn = e.target.closest('.opt-btn');
        if (!btn) return;
        btn.style.transition = 'none';
        btn.style.transform = 'scale(0.96)';
        setTimeout(function() {
            btn.style.transition = '';
            btn.style.transform = '';
        }, 100);
    }, { passive: true });

    console.log('🌟 选项栏已加载（掌中的美母 · 酒红香槟金）');
})();
</script>

</body>
</html>
