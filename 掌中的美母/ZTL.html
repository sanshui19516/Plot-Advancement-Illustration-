<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>掌中的美母 · 状态栏</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
    min-height: auto;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    background: transparent;
    padding: 20px;
    font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
}
.status-container {
    width: 100%;
    max-width: 520px;
    border-radius: 28px;
    border: 1px solid hsla(42, 30%, 55%, 0.12);
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
    padding: 18px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: hsla(350, 18%, 10%, 0.9);
}
.status-container::after {
    content: '';
    position: absolute;
    inset: -50%;
    background: radial-gradient(ellipse at 30% 20%, hsla(42, 60%, 45%, 0.04), transparent 60%);
    animation: shimmer 10s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 0;
}
@keyframes shimmer {
    0% { transform: translate(-5%, -5%) scale(1); opacity: 0.4; }
    100% { transform: translate(5%, 5%) scale(1.1); opacity: 0.8; }
}
.status-container > * { position: relative; z-index: 1; }

.header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding-bottom: 12px;
    border-bottom: 1px solid hsla(42, 20%, 50%, 0.1);
    margin-bottom: 12px;
}
.header-left { flex: 1; min-width: 0; }
.header-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    color: hsl(42, 60%, 65%);
    margin-bottom: 4px;
}
.header-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 11px;
    color: hsla(42, 20%, 70%, 0.7);
}
.header-meta span { display: flex; align-items: center; gap: 4px; }
.header-meta .dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: hsl(42, 60%, 55%);
    animation: pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.4); }
}
.header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.father-warning {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 6px;
    background: hsla(350, 60%, 50%, 0.2);
    color: hsl(350, 70%, 70%);
    border: 1px solid hsla(350, 60%, 50%, 0.3);
    animation: warnPulse 2s ease-in-out infinite;
}
@keyframes warnPulse {
    0%, 100% { opacity: 0.8; }
    50% { opacity: 1; }
}
.fold-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: hsla(42, 20%, 70%, 0.4);
    padding: 4px;
    display: flex;
    align-items: center;
    transition: color 0.3s;
}
.fold-btn:hover { color: hsla(42, 30%, 80%, 0.8); }
.fold-btn svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform 0.3s;
}
.status-container.collapsed .fold-btn svg { transform: rotate(-90deg); }
.status-container.collapsed .role-hero,
.status-container.collapsed .l2,
.status-container.collapsed .l3 { display: none; }

/* ============ 角色头卡（主面板顶部） ============ */
.role-hero {
    display: flex;
    gap: 14px;
    padding: 14px 16px;
    background: linear-gradient(135deg, hsla(350, 40%, 20%, 0.25), hsla(42, 30%, 20%, 0.1));
    border: 1px solid hsla(42, 30%, 50%, 0.12);
    border-radius: 16px;
    margin-bottom: 12px;
    align-items: center;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
}
/* ⬇️ 主面板头像：竖长方形 72x96 ⬇️ */
.role-hero-avatar {
    width: 72px;
    height: 96px;
    border-radius: 14px;
    overflow: hidden;
    flex-shrink: 0;
    border: 2px solid hsla(42, 60%, 55%, 0.3);
    background: hsla(42, 20%, 15%, 0.6);
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
    cursor: pointer;
    transition: transform 0.3s, border-color 0.3s;
}
.role-hero-avatar:hover {
    border-color: hsla(42, 60%, 55%, 0.6);
    transform: scale(1.03);
}
.role-hero-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
}
.role-hero-content {
    flex: 1;
    min-width: 0;
}
.role-hero-name {
    font-size: 15px;
    font-weight: 700;
    color: hsl(42, 65%, 75%);
    letter-spacing: 1px;
    margin-bottom: 3px;
}
.role-hero-subtitle {
    font-size: 11px;
    color: hsla(42, 30%, 80%, 0.7);
    letter-spacing: 0.5px;
    margin-bottom: 5px;
}
.role-hero-desc {
    font-size: 10px;
    color: hsla(42, 25%, 75%, 0.55);
    letter-spacing: 0.3px;
    line-height: 1.5;
}

.l2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
}
.ring-card {
    background: hsla(350, 15%, 14%, 0.6);
    border: 1px solid hsla(42, 20%, 50%, 0.1);
    border-radius: 16px;
    padding: 14px 12px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.ring-wrap {
    position: relative;
    width: 80px;
    height: 80px;
    margin-bottom: 6px;
}
.ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg {
    fill: none;
    stroke: hsla(42, 20%, 50%, 0.1);
    stroke-width: 6;
}
.ring-fill {
    fill: none;
    stroke-width: 6;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.8s ease;
}
.ring-fill.intimacy { stroke: hsl(350, 65%, 60%); }
.ring-fill.submit { stroke: hsl(280, 55%, 65%); }
.ring-value {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    color: hsla(42, 30%, 90%, 0.95);
}
.ring-value .unit {
    font-size: 9px;
    font-weight: 400;
    color: hsla(42, 20%, 70%, 0.5);
}
.ring-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    color: hsla(42, 25%, 75%, 0.85);
}

.relation-info {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: linear-gradient(135deg, hsla(350, 40%, 20%, 0.3), hsla(42, 30%, 20%, 0.15));
    border-radius: 14px;
    border-left: 3px solid hsl(42, 60%, 55%);
}
.relation-status {
    font-size: 14px;
    font-weight: 700;
    color: hsl(42, 60%, 70%);
    letter-spacing: 2px;
}
.emotion-tag {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 10px;
    background: hsla(42, 40%, 50%, 0.15);
    color: hsl(42, 50%, 75%);
    border: 1px solid hsla(42, 40%, 50%, 0.2);
}
.badges {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}
.badge {
    font-size: 10px;
    padding: 3px 10px;
    border-radius: 10px;
    font-weight: 600;
    letter-spacing: 0.5px;
}
.badge.pregnant {
    background: hsla(350, 60%, 50%, 0.2);
    color: hsl(350, 70%, 75%);
    border: 1px solid hsla(350, 60%, 50%, 0.3);
}
.badge.master {
    background: hsla(280, 50%, 50%, 0.2);
    color: hsl(280, 60%, 80%);
    border: 1px solid hsla(280, 50%, 50%, 0.3);
}
.badge.tattoo {
    background: hsla(42, 60%, 45%, 0.2);
    color: hsl(42, 60%, 75%);
    border: 1px solid hsla(42, 60%, 45%, 0.3);
}

.detail-btn {
    grid-column: 1 / -1;
    width: 100%;
    padding: 9px 0;
    background: hsla(42, 40%, 50%, 0.08);
    border: 1px solid hsla(42, 40%, 50%, 0.15);
    border-radius: 12px;
    color: hsl(42, 50%, 70%);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}
.detail-btn:hover {
    background: hsla(42, 40%, 50%, 0.15);
    border-color: hsla(42, 40%, 50%, 0.3);
    transform: translateY(-1px);
}
.detail-btn svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.l3 {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.panel {
    background: hsla(350, 15%, 14%, 0.5);
    border: 1px solid hsla(42, 20%, 50%, 0.08);
    border-radius: 14px;
    overflow: hidden;
}
.panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    cursor: pointer;
    user-select: none;
}
.panel-title {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: hsla(42, 25%, 80%, 0.9);
    display: flex;
    align-items: center;
    gap: 8px;
}
.panel-title svg {
    width: 14px;
    height: 14px;
    stroke: hsl(42, 50%, 65%);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}
.panel-toggle {
    font-size: 10px;
    color: hsla(42, 20%, 60%, 0.5);
    display: flex;
    align-items: center;
    gap: 4px;
}
.panel-toggle svg {
    width: 12px;
    height: 12px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform 0.3s;
}
.panel.open .panel-toggle svg { transform: rotate(180deg); }
.panel-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease, padding 0.4s ease;
    padding: 0 14px;
}
.panel.open .panel-body {
    max-height: 600px;
    padding: 0 14px 14px;
}

.char-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 6px;
    border-bottom: 1px solid hsla(42, 20%, 50%, 0.05);
    cursor: pointer;
    border-radius: 8px;
    margin: 0 -6px;
    transition: background 0.2s;
}
.char-row:last-child { border-bottom: none; }
.char-row:hover { background: hsla(42, 40%, 50%, 0.06); }
.char-row::after {
    content: '\203A';
    font-size: 16px;
    color: hsla(42, 20%, 60%, 0.4);
    flex-shrink: 0;
}
.char-avatar-sm {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    border: 1px solid hsla(42, 60%, 55%, 0.3);
    background: hsla(42, 20%, 15%, 0.6);
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s;
}
.char-avatar-sm:hover {
    transform: scale(1.15);
    border-color: hsla(42, 60%, 55%, 0.7);
}
.char-avatar-sm img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
.char-name {
    font-size: 12px;
    font-weight: 600;
    color: hsla(42, 25%, 85%, 0.9);
    width: 56px;
    flex-shrink: 0;
}
.char-bar {
    flex: 1;
    height: 6px;
    background: hsla(42, 20%, 50%, 0.1);
    border-radius: 3px;
    overflow: hidden;
}
.char-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.6s ease;
}
.char-bar-fill.yiyi {
    background: linear-gradient(90deg, hsl(350, 60%, 50%), hsl(350, 70%, 65%));
}
.char-bar-fill.linyi {
    background: linear-gradient(90deg, hsl(280, 50%, 55%), hsl(280, 60%, 70%));
}
.char-bar-fill.hansu {
    background: linear-gradient(90deg, hsl(42, 60%, 50%), hsl(42, 70%, 65%));
}
.char-status {
    font-size: 10px;
    color: hsla(42, 20%, 70%, 0.6);
    width: 56px;
    text-align: right;
    flex-shrink: 0;
}

.world-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}
.world-cell {
    background: hsla(42, 20%, 50%, 0.04);
    border-radius: 10px;
    padding: 8px 10px;
}
.world-cell .label {
    font-size: 9px;
    color: hsla(42, 20%, 70%, 0.5);
    letter-spacing: 0.5px;
    margin-bottom: 2px;
}
.world-cell .value {
    font-size: 12px;
    font-weight: 600;
    color: hsla(42, 25%, 88%, 0.9);
}

/* ============ 详情抽屉 ============ */
.drawer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: inherit;
    background: hsl(350, 15%, 8%);
    z-index: 50;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
}
.drawer.open { transform: translateX(0); }

.drawer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 20px;
    border-bottom: 1px solid hsla(42, 20%, 50%, 0.1);
    flex-shrink: 0;
}
.drawer-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    color: hsl(42, 60%, 70%);
}
.drawer-close {
    background: none;
    border: none;
    cursor: pointer;
    color: hsla(42, 20%, 70%, 0.5);
    font-size: 20px;
    padding: 4px 8px;
    font-family: inherit;
    line-height: 1;
    transition: color 0.3s;
}
.drawer-close:hover { color: hsl(42, 60%, 75%); }

.drawer-tabs {
    display: flex;
    gap: 4px;
    padding: 12px 20px 0;
    border-bottom: 1px solid hsla(42, 20%, 50%, 0.08);
    flex-shrink: 0;
}
.drawer-tab {
    flex: 1;
    padding: 9px 0;
    background: none;
    border: none;
    color: hsla(42, 20%, 70%, 0.4);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    font-family: inherit;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 0.3s;
}
.drawer-tab:hover { color: hsla(42, 30%, 80%, 0.7); }
.drawer-tab.active {
    color: hsl(42, 60%, 70%);
    border-bottom-color: hsl(42, 60%, 55%);
}

/* ============ 内置滚动条 ============ */
.drawer-content {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px 24px;
    min-height: 0;
    scrollbar-width: thin;
    scrollbar-color: hsla(42, 55%, 58%, 0.4) transparent;
}
.drawer-content::-webkit-scrollbar { width: 5px; height: 5px; }
.drawer-content::-webkit-scrollbar-track { background: transparent; margin: 8px 0; }
.drawer-content::-webkit-scrollbar-thumb {
    background: hsla(42, 55%, 58%, 0.4);
    border-radius: 99px;
    transition: background 0.3s ease;
}
.drawer-content::-webkit-scrollbar-thumb:hover { background: hsla(42, 60%, 65%, 0.7); }
.drawer-content::-webkit-scrollbar-corner { background: transparent; }

.drawer-pane { display: none; }
.drawer-pane.active { display: block; }

/* 抽屉内的角色简介卡（带头像） */
.char-hero {
    background: linear-gradient(135deg, hsla(350, 40%, 20%, 0.3), hsla(42, 30%, 20%, 0.15));
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 16px;
    border: 1px solid hsla(42, 30%, 50%, 0.15);
    display: flex;
    gap: 14px;
    align-items: center;
}
/* ⬇️ 抽屉内头像：竖长方形 64x88 ⬇️ */
.char-hero-avatar {
    width: 64px;
    height: 88px;
    border-radius: 12px;
    overflow: hidden;
    flex-shrink: 0;
    border: 2px solid hsla(42, 60%, 55%, 0.3);
    background: hsla(42, 20%, 15%, 0.6);
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
    cursor: pointer;
    transition: transform 0.3s, border-color 0.3s;
}
.char-hero-avatar:hover {
    border-color: hsla(42, 60%, 55%, 0.6);
    transform: scale(1.03);
}
.char-hero-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
}
.char-hero-text { flex: 1; min-width: 0; }
.char-hero .name {
    font-size: 15px;
    font-weight: 700;
    color: hsl(42, 65%, 75%);
    letter-spacing: 1px;
    margin-bottom: 3px;
}
.char-hero .sub {
    font-size: 11px;
    color: hsla(42, 30%, 80%, 0.7);
    letter-spacing: 0.5px;
    margin-bottom: 5px;
}
.char-hero .desc {
    font-size: 10px;
    color: hsla(42, 25%, 75%, 0.55);
    letter-spacing: 0.3px;
    line-height: 1.5;
}
.char-hero .relation {
    font-size: 12px;
    font-weight: 700;
    color: hsl(350, 65%, 70%);
    padding: 4px 10px;
    border-radius: 10px;
    background: hsla(350, 60%, 50%, 0.15);
    border: 1px solid hsla(350, 60%, 50%, 0.25);
    letter-spacing: 1px;
    flex-shrink: 0;
    align-self: flex-start;
}

.milestone-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
}
.milestone-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 11px;
    background: hsla(42, 20%, 50%, 0.04);
    border: 1px solid hsla(42, 20%, 50%, 0.06);
}
.milestone-item.done {
    background: hsla(42, 50%, 50%, 0.08);
    border-color: hsla(42, 50%, 50%, 0.2);
    color: hsl(42, 55%, 75%);
}
.milestone-item.undone { color: hsla(42, 15%, 65%, 0.4); }
.milestone-item .check {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: 700;
}
.milestone-item.done .check {
    background: hsl(42, 60%, 55%);
    color: hsl(350, 15%, 8%);
}
.milestone-item.undone .check {
    background: hsla(42, 20%, 50%, 0.15);
    color: hsla(42, 20%, 70%, 0.4);
}

.count-list { display: flex; flex-direction: column; gap: 8px; }
.count-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: hsla(42, 20%, 50%, 0.04);
    border-radius: 10px;
    border: 1px solid hsla(42, 20%, 50%, 0.06);
}
.count-label {
    font-size: 12px;
    color: hsla(42, 25%, 80%, 0.8);
}
.count-value {
    font-size: 16px;
    font-weight: 700;
    color: hsl(42, 60%, 70%);
}

.mark-list { display: flex; flex-direction: column; gap: 8px; }
.mark-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    background: hsla(42, 20%, 50%, 0.04);
    border-radius: 10px;
    border: 1px solid hsla(42, 20%, 50%, 0.06);
}
.mark-label {
    font-size: 12px;
    color: hsla(42, 25%, 80%, 0.8);
}
.mark-value {
    font-size: 12px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 8px;
}
.mark-value.yes {
    background: hsla(140, 50%, 50%, 0.2);
    color: hsl(140, 60%, 70%);
}
.mark-value.no {
    background: hsla(42, 20%, 50%, 0.1);
    color: hsla(42, 20%, 70%, 0.5);
}

.chapter-progress {
    background: linear-gradient(135deg, hsla(350, 40%, 20%, 0.3), hsla(42, 30%, 20%, 0.15));
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 16px;
    border: 1px solid hsla(42, 30%, 50%, 0.15);
}
.chapter-progress .label {
    font-size: 10px;
    color: hsla(42, 20%, 70%, 0.6);
    letter-spacing: 1px;
    margin-bottom: 4px;
}
.chapter-progress .value {
    font-size: 22px;
    font-weight: 800;
    color: hsl(42, 65%, 72%);
    margin-bottom: 8px;
}
.chapter-progress .value .suffix {
    font-size: 13px;
    font-weight: 400;
    color: hsla(42, 20%, 70%, 0.4);
}
.chapter-progress .bar {
    height: 6px;
    background: hsla(42, 20%, 50%, 0.1);
    border-radius: 3px;
    overflow: hidden;
}
.chapter-progress .bar .fill {
    height: 100%;
    background: linear-gradient(90deg, hsl(350, 60%, 50%), hsl(42, 70%, 65%));

.timeline { position: relative; padding-left: 20px; }

    position: absolute;
    left: 6px;
    top: 8px;
    bottom: 8px;
    width: 1.5px;

}

}
.timeline-item::before {

    position: absolute;
    left: -14px;
    top: 50%;
    transform: translateY(-50%);
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: hsla(42, 20%, 50%, 0.15);
    border: 1.5px solid hsla(42, 20%, 50%, 0.25);
}

}
.timeline-item.current {
    color: hsl(42, 65%, 72%);

}
.timeline-item.current::before {
    background: hsl(350, 65%, 60%);
    border-color: hsl(350, 65%, 60%);

}
.timeline-item .num {

/* ============================================================
   MVU 数据读取
   ============================================================ */
function getMVUData() {
    try {
        var allVars = typeof getAllVariables === 'function' ? getAllVariables() : {};
        return allVars.stat_data || {};
    } catch (e) {
        return {};
    }
}

function fetchStateFromMVU() {
    var data = getMVUData();
    if (!data || Object.keys(data).length === 0) return;

    state.chapter = _.get(data, '事件.当前章节', '第1章');
    state.time = _.get(data, '世界.时段', '--');
    state.place = _.get(data, '世界.地点', '--');
    state.season = _.get(data, '世界.季节', '--');
    state.weather = _.get(data, '世界.天气', '--');
    state.activity = _.get(data, '世界.当前活动', '--');
    state.father = _.get(data, '世界.父亲是否在家', false);

    state.intimacy = _.get(data, '柳如玉.亲密', 0);
    state.submit = _.get(data, '柳如玉.顺从', 0);
    state.stage = _.get(data, '柳如玉.关系状态', '--');
    state.emotion = _.get(data, '柳如玉.当前情绪', '--');
    state.pregnant = _.get(data, '柳如玉.是否怀孕', false);
    state.master = _.get(data, '柳如玉.是否已签主奴契约', false);
    state.tattoo = _.get(data, '柳如玉.是否已纹淫纹', false);
}

/* ============================================================
   渲染：头部
   ============================================================ */
function renderHeader() {
    var cur = state.chapter;
    var name = CHAPTER_NAMES[cur] || '';
    var el = document.getElementById('headerTitle');
    if (el) el.textContent = '掌中的美母 · ' + cur + (name ? ' ' + name : '');

    var t = document.getElementById('hTime'); if (t) t.textContent = state.time;
    var p = document.getElementById('hPlace'); if (p) p.textContent = state.place;
    var sw = document.getElementById('hSeasonWeather'); if (sw) sw.textContent = state.season + ' · ' + state.weather;
    var ac = document.getElementById('hActivity'); if (ac) ac.textContent = state.activity;

    var fw = document.getElementById('fatherWarning');
    if (fw) fw.style.display = state.father ? 'block' : 'none';
}

/* ============================================================
   渲染：主面板角色头卡（柳如玉）
   ============================================================ */
function renderRoleHero() {
    var profile = getProfile('liuruoyu', state.stage);
    if (!profile) return;

    var img = document.getElementById('roleHeroImg');
    var name = document.getElementById('roleHeroName');
    var sub = document.getElementById('roleHeroSubtitle');
    var desc = document.getElementById('roleHeroDesc');

    if (img) img.src = profile.avatar;
    if (name) name.textContent = profile.name;
    if (sub) sub.textContent = profile.subtitle;
    if (desc) desc.textContent = profile.desc;
}

/* ============================================================
   渲染：核心环形
   ============================================================ */
function renderCore() {
    var intimacy = Number(state.intimacy) || 0;
    var submit = Number(state.submit) || 0;

    var vi = document.getElementById('valIntimacy'); if (vi) vi.textContent = intimacy;
    var vs = document.getElementById('valSubmit'); if (vs) vs.textContent = submit;

    var C = 213.6;
    var ri = document.getElementById('ringIntimacy');
    var rs = document.getElementById('ringSubmit');
    if (ri) ri.setAttribute('stroke-dashoffset', C * (1 - Math.min(Math.max(intimacy, 0), 1000) / 1000));
    if (rs) rs.setAttribute('stroke-dashoffset', C * (1 - Math.min(Math.max(submit, 0), 1000) / 1000));

    var rst = document.getElementById('relationStatus'); if (rst) rst.textContent = state.stage;
    var em = document.getElementById('emotionTag'); if (em) em.textContent = state.emotion;

    var badges = '';
    if (state.pregnant) badges += '<div class="badge pregnant">已怀孕</div>';
    if (state.master) badges += '<div class="badge master">已签主奴契约</div>';
    if (state.tattoo) badges += '<div class="badge tattoo">已纹淫纹</div>';
    var bx = document.getElementById('badges'); if (bx) bx.innerHTML = badges;
}

/* ============================================================
   渲染：其他角色行
   ============================================================ */
function renderOtherChars() {
    var data = getMVUData();

    var yiyi = Number(_.get(data, '周依依.亲密', 0)) || 0;
    var linyi = Number(_.get(data, '周琳依.亲密', 0)) || 0;
    var hansu = Number(_.get(data, '韩素.亲密', 0)) || 0;

    var by = document.getElementById('barYiyi'); if (by) by.style.width = Math.min(yiyi / 10, 100) + '%';
    var bl = document.getElementById('barLinyi'); if (bl) bl.style.width = Math.min(linyi / 10, 100) + '%';
    var bh = document.getElementById('barHansu'); if (bh) bh.style.width = Math.min(hansu / 10, 100) + '%';

    var sy = document.getElementById('statusYiyi'); if (sy) sy.textContent = _.get(data, '周依依.关系状态', '--');
    var sl = document.getElementById('statusLinyi'); if (sl) sl.textContent = _.get(data, '周琳依.关系状态', '--');
    var sh = document.getElementById('statusHansu'); if (sh) sh.textContent = _.get(data, '韩素.关系状态', '--');

    var pYiyi = getProfile('zhouyiyi', _.get(data, '周依依.关系状态', '陌生人'));
    var pLinyi = getProfile('zhoulinyi', _.get(data, '周琳依.关系状态', '陌生人'));
    var pHansu = getProfile('hansu', _.get(data, '韩素.关系状态', '陌生人'));

    var aY = document.getElementById('avatarYiyi'); if (aY && pYiyi) aY.src = pYiyi.avatar;
    var aL = document.getElementById('avatarLinyi'); if (aL && pLinyi) aL.src = pLinyi.avatar;
    var aH = document.getElementById('avatarHansu'); if (aH && pHansu) aH.src = pHansu.avatar;
}

/* ============================================================
   渲染：世界状态
   ============================================================ */
function renderWorld() {
    var data = getMVUData();

    var wt = document.getElementById('wTime'); if (wt) wt.textContent = _.get(data, '世界.时间', '--');
    var ws = document.getElementById('wSeason'); if (ws) ws.textContent = _.get(data, '世界.季节', '--');
    var ww = document.getElementById('wWeather'); if (ww) ww.textContent = _.get(data, '世界.天气', '--');
    var wp = document.getElementById('wPeriod'); if (wp) wp.textContent = _.get(data, '世界.时段', '--');
    var wpl = document.getElementById('wPlace'); if (wpl) wpl.textContent = _.get(data, '世界.地点', '--');
    var wsc = document.getElementById('wScene'); if (wsc) wsc.textContent = _.get(data, '世界.当前场景', '--');
    var wa = document.getElementById('wActivity'); if (wa) wa.textContent = _.get(data, '世界.当前活动', '--');
    var wf = document.getElementById('wFather'); if (wf) wf.textContent = _.get(data, '世界.父亲是否在家', false) ? '在家' : '外出';
}

/* ============================================================
   渲染：抽屉内容
   ============================================================ */
function buildDrawerContent(charKey) {
    var cfg = CHARS[charKey];
    if (!cfg) return;

    var data = getMVUData();
    var stagePath = charKey === 'liuruoyu' ? '柳如玉.关系状态' :
                    charKey === 'zhouyiyi' ? '周依依.关系状态' :
                    charKey === 'zhoulinyi' ? '周琳依.关系状态' : '韩素.关系状态';
    var stage = _.get(data, stagePath, '--');
    var profile = getProfile(charKey, stage);

    var titleEl = document.getElementById('drawerTitle');
    if (titleEl) titleEl.textContent = profile.name + ' · 完整详情';

    var tabsAvailable = [];
    if (cfg.hasChapter) tabsAvailable.push('chapter');
    if (cfg.hasMilestone) tabsAvailable.push('milestone');
    if (cfg.hasCount) tabsAvailable.push('count');
    if (cfg.hasMark) tabsAvailable.push('mark');
    if (tabsAvailable.indexOf(currentDrawerTab) === -1) {
        currentDrawerTab = tabsAvailable[0];
    }

    var tabs = [];
    if (cfg.hasChapter) tabs.push({ key: 'chapter', label: '章节' });
    if (cfg.hasMilestone) tabs.push({ key: 'milestone', label: '里程碑' });
    if (cfg.hasCount) tabs.push({ key: 'count', label: '计数' });
    if (cfg.hasMark) tabs.push({ key: 'mark', label: '标记' });

    var tabsEl = document.getElementById('drawerTabs');
    var tabsHtml = '';
    for (var i = 0; i < tabs.length; i++) {
        var activeCls = (tabs[i].key === currentDrawerTab) ? ' active' : '';
        tabsHtml += '<button class="drawer-tab' + activeCls + '" data-tab="' + tabs[i].key + '" onclick="switchTab(this)">' + tabs[i].label + '</button>';
    }
    if (tabsEl) tabsEl.innerHTML = tabsHtml;

    var contentEl = document.getElementById('drawerContent');
    var html = '';

    /* 角色简介卡（头像可点击放大） */
    html += '<div class="char-hero">' +
            '<div class="char-hero-avatar" onclick="openImageOverlay(\'' + profile.avatar + '\')">' +
            '<img src="' + profile.avatar + '" alt="' + profile.name + '" />' +
            '</div>' +
            '<div class="char-hero-text">' +
            '<div class="name">' + profile.name + '</div>' +
            '<div class="sub">' + profile.subtitle + '</div>' +
            '<div class="desc">' + profile.desc + '</div>' +
            '</div>' +
            '<div class="relation">' + stage + '</div>' +
            '</div>';

    /* 章节页 */
    if (cfg.hasChapter) {
        var cur = _.get(data, '事件.当前章节', '第1章');
        var curNum = parseInt(String(cur).replace(/[^\d]/g, ''), 10) || 1;
        var name = CHAPTER_NAMES[cur] || '';
        var activeC = (currentDrawerTab === 'chapter') ? ' active' : '';
        html += '<div class="drawer-pane' + activeC + '" id="pane-chapter">' +
                '<div class="chapter-progress">' +
                '<div class="label">当前章节</div>' +
                '<div class="value">' + cur + (name ? ' ' + name : '') + '<span class="suffix"> ' + curNum + '/120</span></div>' +
                '<div class="bar"><div class="fill" style="width:' + (curNum / 120 * 100) + '%"></div></div>' +
                '</div>' +
                '<div class="timeline">';
        var events = _.get(data, '事件.章节', {}) || {};
        for (var n = 1; n <= 120; n++) {
            var key = '第' + n + '章';
            var chName = CHAPTER_NAMES[key] || '';
            var done = events && events[key] === true;
            var cls = done ? 'done' : (n === curNum ? 'current' : '');
            html += '<div class="timeline-item ' + cls + '"><span class="num">' + key + '</span>' + (chName || '—') + '</div>';
        }
        html += '</div></div>';
    }

    /* 里程碑页 */
    if (cfg.hasMilestone) {
        var mPath = charKey === 'liuruoyu' ? '柳如玉.里程碑' :
                    charKey === 'zhouyiyi' ? '周依依.里程碑' :
                    charKey === 'zhoulinyi' ? '周琳依.里程碑' : '韩素.里程碑';
        var m = _.get(data, mPath, {}) || {};

        var activeM = (currentDrawerTab === 'milestone') ? ' active' : '';
        html += '<div class="drawer-pane' + activeM + '" id="pane-milestone"><div class="milestone-grid">';
        for (var j = 0; j < cfg.milestones.length; j++) {
            var mn = cfg.milestones[j];
            var ok = m[mn] === true;
            html += '<div class="milestone-item ' + (ok ? 'done' : 'undone') + '">' +
                    '<span class="check">' + (ok ? '\u2713' : '\u2717') + '</span>' + mn + '</div>';
        }
        html += '</div></div>';
    }

    /* 计数页 */
    if (cfg.hasCount) {
        var cPath = charKey === 'liuruoyu' ? '柳如玉.计数' :
                    charKey === 'zhouyiyi' ? '周依依.计数' :
                    charKey === 'zhoulinyi' ? '周琳依.计数' : '韩素.计数';
        var c = _.get(data, cPath, {}) || {};

        var activeC2 = (currentDrawerTab === 'count') ? ' active' : '';
        html += '<div class="drawer-pane' + activeC2 + '" id="pane-count"><div class="count-list">';
        for (var k = 0; k < cfg.counts.length; k++) {
            var cn = cfg.counts[k];
            html += '<div class="count-item"><span class="count-label">' + cn + '</span>' +
                    '<span class="count-value">' + (Number(c[cn]) || 0) + '</span></div>';
        }
        html += '</div></div>';
    }

    /* 标记页 */
    if (cfg.hasMark) {
        var activeK = (currentDrawerTab === 'mark') ? ' active' : '';
        html += '<div class="drawer-pane' + activeK + '" id="pane-mark"><div class="mark-list">';
        for (var x = 0; x < cfg.marks.length; x++) {
            var mk = cfg.marks[x];
            var v = _.get(data, mk.path, false);
            html += '<div class="mark-item"><span class="mark-label">' + mk.label + '</span>' +
                    '<span class="mark-value ' + (v ? 'yes' : 'no') + '">' + (v ? '是' : '否') + '</span></div>';
        }
        html += '</div></div>';
    }

    if (contentEl) contentEl.innerHTML = html;
}

/* ============================================================
   快照 key
   ============================================================ */
function getSnapshotKey() {
    var data = getMVUData();
    return JSON.stringify({
        c: _.get(data, '事件.当前章节', ''),
        cs: _.get(data, '事件.章节', {}),
        lry: _.get(data, '柳如玉', {}),
        yy: _.get(data, '周依依', {}),
        ly: _.get(data, '周琳依', {}),
        hs: _.get(data, '韩素', {})
    });
}

/* ============================================================
   渲染主函数
   ============================================================ */
function render() {
    renderHeader();
    renderRoleHero();
    renderCore();
    renderOtherChars();
    renderWorld();

    var d = document.getElementById('drawer');
    if (d && d.classList.contains('open')) {
        var key = getSnapshotKey();
        if (key !== lastSnapshotKey) {
            lastSnapshotKey = key;
            var content = document.getElementById('drawerContent');
            var scrollTop = content ? content.scrollTop : 0;
            buildDrawerContent(currentDrawerChar);
            if (content) content.scrollTop = scrollTop;
        }
    }
}

/* ============================================================
   折叠
   ============================================================ */
function toggleFold() {
    var app = document.getElementById('app');
    if (!app) return;
    app.classList.toggle('collapsed');
    try {
        localStorage.setItem(FOLD_KEY, app.classList.contains('collapsed') ? 'true' : 'false');
    } catch (e) {}
}

/* ============================================================
   面板
   ============================================================ */
function togglePanel(id) {
    var p = document.getElementById(id);
    if (p) p.classList.toggle('open');
}

/* ============================================================
   详情抽屉
   ============================================================ */
function openDrawer(charKey) {
    if (!charKey || !CHARS[charKey]) charKey = 'liuruoyu';
    currentDrawerChar = charKey;

    var cfg = CHARS[charKey];
    currentDrawerTab = cfg.hasChapter ? 'chapter' : (cfg.hasMilestone ? 'milestone' : (cfg.hasCount ? 'count' : 'mark'));

    lastSnapshotKey = getSnapshotKey();
    buildDrawerContent(charKey);

    var d = document.getElementById('drawer');
    if (d) d.classList.add('open');

    var content = document.getElementById('drawerContent');
    if (content) content.scrollTop = 0;
}

function closeDrawer() {
    var d = document.getElementById('drawer');
    if (d) d.classList.remove('open');
}

/* ============================================================
   抽屉标签页
   ============================================================ */
function switchTab(el) {
    var tabsWrap = el.parentElement;
    var drawer = tabsWrap ? tabsWrap.parentElement : null;
    if (!drawer) return;

    currentDrawerTab = el.dataset.tab;

    var tabs = drawer.querySelectorAll('.drawer-tab');
    for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
    el.classList.add('active');

    var panes = drawer.querySelectorAll('.drawer-pane');
    for (var j = 0; j < panes.length; j++) panes[j].classList.remove('active');

    var pane = drawer.querySelector('#pane-' + el.dataset.tab);
    if (pane) pane.classList.add('active');

    var content = document.getElementById('drawerContent');
    if (content) content.scrollTop = 0;
}

/* ============================================================
   图片放大遮罩
   ============================================================ */
function openImageOverlay(src) {
    if (!src) return;
    var overlay = document.getElementById('imageOverlay');
    var img = document.getElementById('overlayImage');
    if (!overlay || !img) return;
    img.src = src;
    overlay.classList.add('active');
}

function closeImageOverlay() {
    var overlay = document.getElementById('imageOverlay');
    var img = document.getElementById('overlayImage');
    if (!overlay || !img) return;
    overlay.classList.remove('active');
    setTimeout(function () { img.src = ''; }, 400);
}

/* ============================================================
   挂到 window
   ============================================================ */
window.toggleFold = toggleFold;
window.togglePanel = togglePanel;
window.openDrawer = openDrawer;
window.closeDrawer = closeDrawer;
window.switchTab = switchTab;
window.openImageOverlay = openImageOverlay;
window.closeImageOverlay = closeImageOverlay;

/* ============================================================
   初始化
   ============================================================ */
function init() {
    try {
        var saved = localStorage.getItem(FOLD_KEY);
        var app = document.getElementById('app');
        if (saved === 'true' && app) app.classList.add('collapsed');
    } catch (e) {}

    if (typeof waitGlobalInitialized === 'function') {
        waitGlobalInitialized('Mvu').then(function () {
            fetchStateFromMVU();
            render();
        })['catch'](function () {
            fetchStateFromMVU();
            render();
        });
    } else {
        fetchStateFromMVU();
        render();
    }

    setInterval(function () {
        fetchStateFromMVU();
        render();
    }, 2000);

    try {
        if (typeof eventOn === 'function' && typeof Mvu !== 'undefined' && Mvu.events && Mvu.events.VARIABLE_UPDATE_ENDED) {
            eventOn(Mvu.events.VARIABLE_UPDATE_ENDED, function () {
                fetchStateFromMVU();
                render();
            });
        }
    } catch (e) {}

    /* ESC 关闭放大遮罩 */
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeImageOverlay();
    });
}

if (typeof errorCatched === 'function') {
    $(errorCatched(init));
} else {
    $(init);
}

console.log('掌中的美母 · 状态栏已加载');
</script>
