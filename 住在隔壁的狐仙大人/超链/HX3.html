<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>九尾狐月 · 苏九尾</title>

<style>
@import url("https://fontsapi.zeoseven.com/370/main/result.css");

:root {
  --fox-red: hsl(352, 62%, 46%);
  --fox-red-b: hsl(352, 70%, 62%);
  --fox-red-glow: hsla(352, 70%, 55%, 0.28);
  --fox-fire: hsl(28, 88%, 58%);
  --fox-fire-b: hsl(38, 92%, 70%);
  --moon: #f5ece0;
  --moon-dim: hsla(42, 45%, 88%, 0.52);
  --night: #08060d;
  --jade: hsl(158, 30%, 46%);
  --gold: hsl(42, 68%, 60%);
  --border: hsla(42, 45%, 88%, 0.08);
  --border-2: hsla(42, 45%, 88%, 0.16);
  --border-red: hsla(352, 62%, 52%, 0.28);
  --font-main: "KTXP-GlowRound", 'Georgia', 'Songti SC', serif;
  --font-hand: "KTXP-GlowRound", 'KaiTi', 'STKaiti', serif;
  --mono: 'DIN', 'Courier New', 'Consolas', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { background: transparent; margin: 0; padding: 0; min-height: auto; }

body {
  font-family: var(--font-main);
  color: var(--moon);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 16px 10px;
  line-height: 1.55;
}

.panel {
  width: 100%;
  max-width: 640px;
  position: relative;
  border-radius: 3px;
  overflow: hidden;
  background: var(--night);
  border: 1px solid var(--border-red);
  box-shadow:
    0 28px 70px rgba(0, 0, 0, 0.85),
    0 0 0 1px hsla(42, 45%, 88%, 0.03),
    inset 0 0 120px hsla(352, 40%, 25%, 0.10);
  isolation: isolate;
  transition: box-shadow 1s ease, border-color 1s ease;
}

.panel::before,
.panel::after {
  content: '';
  position: absolute;
  width: 32px;
  height: 32px;
  border: 1px solid var(--border-red);
  z-index: 12;
  pointer-events: none;
}
.panel::before {
  top: 6px; left: 6px;
  border-right: none; border-bottom: none;
  border-top-left-radius: 2px;
}
.panel::after {
  bottom: 6px; right: 6px;
  border-left: none; border-top: none;
  border-bottom-right-radius: 2px;
}

.panel-bg {
  position: absolute;
  inset: -40px;
  background-size: cover;
  background-position: center 25%;
  filter: blur(60px) brightness(0.22) saturate(1.1);
  z-index: 0;
  transition: opacity 1.2s ease;
  opacity: 0.95;
}
.panel-bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 30% 20%, hsla(352, 62%, 40%, 0.25) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 85%, hsla(160, 30%, 40%, 0.10) 0%, transparent 50%),
    linear-gradient(180deg, rgba(8,6,13,0.35) 0%, rgba(8,6,13,0.88) 100%);
}

.panel .top-line {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent 0%, var(--fox-red) 20%, var(--gold) 50%, var(--fox-red) 80%, transparent 100%);
  z-index: 15;
  opacity: 0.7;
}

.panel > *:not(.panel-bg):not(.top-line) { position: relative; z-index: 2; }

/* ═══ 折叠态 ═══ */
.collapsed-bar {
  display: none;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  min-height: 64px;
  cursor: pointer;
}
.panel.collapsed .collapsed-bar { display: flex; }
.panel.collapsed .expanded-view { display: none; }
.panel.collapsed { border-color: var(--border-2); }

.collapsed-moon {
  position: relative;
  width: 44px; height: 44px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.collapsed-moon::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px solid var(--fox-red);
  opacity: 0.6;
}
.collapsed-moon::after {
  content: '';
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  border: 1px solid var(--gold);
  opacity: 0.3;
  animation: moon-spin-slow 40s linear infinite;
}
@keyframes moon-spin-slow { to { transform: rotate(360deg); } }

.collapsed-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  overflow: hidden;
  flex-shrink: 0;
}
.collapsed-avatar img {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center 15%;
  display: block;
}

.collapsed-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.collapsed-stage {
  font-family: var(--font-hand);
  font-size: 15px;
  color: var(--moon);
  letter-spacing: 4px;
  font-weight: 700;
}
.collapsed-emotion {
  font-family: var(--font-hand);
  font-size: 10px;
  color: var(--moon-dim);
  letter-spacing: 2px;
}

.collapsed-heat {
  flex-shrink: 0;
  padding: 4px 10px;
  border: 1px solid var(--border-2);
  border-radius: 2px;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--moon-dim);
  letter-spacing: 1.5px;
  background: transparent;
  transition: all 0.3s ease;
}
.collapsed-heat.hot {
  border-color: var(--fox-red);
  color: var(--fox-red-b);
  background: hsla(352, 62%, 46%, 0.15);
  box-shadow: 0 0 15px var(--fox-red-glow);
  animation: heat-pulse 2s ease-in-out infinite;
}
@keyframes heat-pulse {
  0%, 100% { box-shadow: 0 0 15px var(--fox-red-glow); }
  50% { box-shadow: 0 0 25px var(--fox-red-glow), 0 0 40px var(--fox-red-glow); }
}

/* ═══ 展开态 ═══ */
.expanded-view { display: flex; flex-direction: column; }

/* 翻页容器 */
.view-wrapper { overflow: hidden; position: relative; }
.view-inner {
  display: flex;
  width: 200%;
  transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
  transform: translateX(0);
}
.view-inner.show-events { transform: translateX(-50%); }
.view-page {
  width: 50%;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
}

/* 顶部细条 */
.top-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 18px;
  border-bottom: 1px solid var(--border);
  background: rgba(8, 6, 13, 0.45);
  backdrop-filter: blur(8px);
  position: relative;
}
.top-bar::before {
  content: '';
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--fox-red);
  box-shadow: 0 0 8px var(--fox-red);
  flex-shrink: 0;
}

.top-scene {
  font-family: var(--font-hand);
  font-size: 13px;
  color: var(--moon);
  letter-spacing: 3px;
  font-weight: 500;
}
.top-scene-sub {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--moon-dim);
  letter-spacing: 0.8px;
  margin-left: auto;
}

.top-toggle {
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 1px solid var(--border-2);
  background: transparent;
  color: var(--moon-dim);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
  font-size: 10px;
  padding: 0;
  flex-shrink: 0;
  font-family: var(--font-main);
}
.top-toggle:hover {
  color: var(--fox-red-b);
  border-color: var(--fox-red);
  transform: rotate(180deg);
}

/* 主体 */
.main-layout {
  display: flex;
  align-items: stretch;
  min-height: 440px;
  position: relative;
}

/* 立绘区 */
.portrait-col {
  flex: 0 0 46%;
  position: relative;
  overflow: hidden;
}

.moon-ring {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 320px; height: 320px;
  border-radius: 50%;
  border: 1px solid hsla(42, 45%, 88%, 0.05);
  z-index: 1;
  pointer-events: none;
}
.moon-ring::before {
  content: '';
  position: absolute;
  inset: 20px;
  border-radius: 50%;
  border: 1px dashed hsla(42, 45%, 88%, 0.04);
  animation: moon-spin-slow 80s linear infinite reverse;
}
.moon-ring::after {
  content: '';
  position: absolute;
  inset: 50px;
  border-radius: 50%;
  background: radial-gradient(circle, hsla(42, 55%, 88%, 0.06) 0%, transparent 70%);
  filter: blur(8px);
}

.ninetails {
  position: absolute;
  top: 8%; left: 50%;
  transform: translateX(-50%);
  width: 100%; height: 85%;
  z-index: 1;
  opacity: 0.14;
  pointer-events: none;
}
.ninetails svg { width: 100%; height: 100%; }
.ninetails path { stroke: var(--fox-red-b); stroke-width: 1; fill: none; }

.portrait {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center 18%;
  background-repeat: no-repeat;
  transition: opacity 0.9s ease, filter 0.9s ease;
  z-index: 2;
  filter: brightness(0.98) contrast(1.02);
}
.portrait::after {
  content: '';
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: 50%;
  background: linear-gradient(to right, transparent 0%, var(--night) 90%);
  pointer-events: none;
}
.portrait::before {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 40%;
  background: linear-gradient(to top, var(--night) 0%, transparent 100%);
  pointer-events: none;
  z-index: 3;
}

.moon-halo {
  position: absolute;
  top: 8%; left: 50%;
  transform: translateX(-50%);
  width: 240px; height: 240px;
  border-radius: 50%;
  background: radial-gradient(circle, hsla(42, 55%, 88%, 0.16) 0%, hsla(352, 50%, 50%, 0.06) 40%, transparent 70%);
  filter: blur(20px);
  z-index: 1;
  pointer-events: none;
  animation: halo-breathe 7s ease-in-out infinite;
}
@keyframes halo-breathe {
  0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.8; }
  50% { transform: translateX(-50%) scale(1.1); opacity: 1; }
}

.foxfire-layer {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  overflow: hidden;
}
.foxfire {
  position: absolute;
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--fox-fire-b);
  box-shadow: 0 0 6px var(--fox-fire), 0 0 12px var(--fox-fire), 0 0 20px hsla(28, 88%, 58%, 0.5);
  opacity: 0;
  animation: foxfire-rise 8s ease-in-out infinite;
}
.foxfire.f1 { left: 12%; bottom: 20%; animation-delay: 0s; }
.foxfire.f2 { left: 28%; bottom: 15%; animation-delay: 2s; }
.foxfire.f3 { left: 52%; bottom: 25%; animation-delay: 4s; }
.foxfire.f4 { left: 76%; bottom: 18%; animation-delay: 1s; }
.foxfire.f5 { left: 88%; bottom: 30%; animation-delay: 3s; }
.foxfire.f6 { left: 40%; bottom: 10%; animation-delay: 5s; }
.foxfire.f7 { left: 64%; bottom: 12%; animation-delay: 6s; }

@keyframes foxfire-rise {
  0% { opacity: 0; transform: translateY(0) scale(0.5); }
  20% { opacity: 0.9; transform: translateY(-20px) scale(1); }
  60% { opacity: 0.7; transform: translateY(-60px) scale(0.9); }
  100% { opacity: 0; transform: translateY(-100px) scale(0.4); }
}

.portrait-overlay {
  position: absolute;
  left: 16px; right: 16px; bottom: 20px;
  z-index: 5;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.stage-seal-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.stage-seal {
  width: 54px; height: 54px;
  flex-shrink: 0;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: hsla(352, 62%, 42%, 0.15);
  border: 1.5px solid var(--fox-red);
  border-radius: 2px;
  box-shadow: 0 0 20px var(--fox-red-glow), inset 0 0 12px hsla(352, 62%, 52%, 0.1);
  transform: rotate(-4deg);
}
.stage-seal-text {
  font-family: var(--font-hand);
  font-size: 9px;
  color: var(--fox-red-b);
  letter-spacing: 0.5px;
  font-weight: 700;
  text-align: center;
  line-height: 1.15;
  max-width: 44px;
  word-break: break-all;
  text-shadow: 0 0 6px var(--fox-red-glow);
}

.stage-label {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.stage-label-en {
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 3px;
  color: var(--fox-red-b);
  opacity: 0.7;
}
.stage-label-name {
  font-family: var(--font-hand);
  font-size: 14px;
  letter-spacing: 3px;
  color: var(--moon);
  font-weight: 700;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
}

.heat-badge {
  position: absolute;
  top: 12px; left: 12px;
  z-index: 6;
  display: none;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  background: hsla(352, 62%, 42%, 0.9);
  backdrop-filter: blur(8px);
  color: var(--moon);
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 2px;
  border-radius: 2px;
  border: 1px solid var(--fox-red-b);
  box-shadow: 0 0 25px var(--fox-red-glow);
}
.panel.is-heat .heat-badge { display: flex; animation: heat-glow 2s ease-in-out infinite; }
@keyframes heat-glow {
  0%, 100% { box-shadow: 0 0 25px var(--fox-red-glow); }
  50% { box-shadow: 0 0 40px var(--fox-red-glow), 0 0 60px var(--fox-red-glow); }
}
.heat-badge::before {
  content: '◈';
  font-size: 8px;
  color: var(--fox-fire-b);
  animation: heat-dot 1.2s ease-in-out infinite;
}
@keyframes heat-dot {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

/* ═══ 信息区 ═══ */
.info-col {
  flex: 1;
  min-width: 0;
  padding: 18px 18px 14px 2px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  position: relative;
}

.info-header {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
  position: relative;
}
.info-header::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 0;
  width: 40px; height: 1px;
  background: var(--fox-red);
  box-shadow: 0 0 8px var(--fox-red);
}
.info-name {
  font-family: var(--font-hand);
  font-size: 21px;
  font-weight: 700;
  color: var(--moon);
  letter-spacing: 5px;
  line-height: 1;
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
}
.info-race {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--fox-red-b);
  letter-spacing: 3px;
  opacity: 0.8;
}
.info-race::before { content: '◆'; font-size: 6px; color: var(--gold); }

/* 数值区 */
.stats-block {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.stat-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.stat-head {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: nowrap;
  min-width: 0;
}

.stat-symbol {
  font-family: var(--font-hand);
  font-size: 11.5px;
  color: var(--gold);
  letter-spacing: 1px;
  font-weight: 600;
  flex-shrink: 0;
  white-space: nowrap;
}

.stat-name {
  font-family: var(--mono);
  font-size: 7.5px;
  color: var(--moon-dim);
  letter-spacing: 1px;
  opacity: 0.6;
  flex-shrink: 0;
  white-space: nowrap;
}

.stat-num {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--moon);
  letter-spacing: 0.5px;
  font-weight: 700;
  margin-left: auto;
  flex-shrink: 0;
}

.stat-bar-wrap {
  position: relative;
  height: 4px;
  background: hsla(42, 45%, 88%, 0.05);
  border-radius: 1px;
  overflow: hidden;
}
.stat-bar {
  height: 100%;
  transition: width 0.9s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  border-radius: 1px;
}
.stat-bar::after {
  content: '';
  position: absolute;
  right: 0; top: -2px; bottom: -2px;
  width: 16px;
  background: radial-gradient(ellipse at right, currentColor, transparent 75%);
  opacity: 0.85;
}
.stat-bar::before {
  content: '';
  position: absolute;
  right: -1px; top: 50%;
  transform: translateY(-50%);
  width: 5px; height: 5px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 8px currentColor;
}

.stat-bar.favor { background: linear-gradient(90deg, hsl(352, 60%, 38%), hsl(352, 70%, 58%)); color: hsl(352, 70%, 62%); }
.stat-bar.trust { background: linear-gradient(90deg, hsl(158, 28%, 36%), hsl(158, 40%, 58%)); color: hsl(158, 45%, 62%); }
.stat-bar.power { background: linear-gradient(90deg, hsl(42, 55%, 40%), hsl(42, 70%, 62%)); color: hsl(42, 75%, 66%); }
.stat-bar.desire { background: linear-gradient(90deg, hsl(340, 55%, 40%), hsl(340, 68%, 62%)); color: hsl(340, 70%, 66%); }

/* 特殊状态 */
.status-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding-top: 8px;
  border-top: 1px dashed var(--border);
}
.status-item {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.status-label {
  font-family: var(--mono);
  font-size: 8px;
  color: var(--moon-dim);
  letter-spacing: 1.5px;
  opacity: 0.7;
}
.status-value {
  font-family: var(--font-hand);
  font-size: 12px;
  color: var(--moon);
  letter-spacing: 1.5px;
  font-weight: 600;
}
.status-value.hot { color: var(--fox-red-b); text-shadow: 0 0 10px var(--fox-red-glow); }
.status-value.warn { color: var(--gold); }
.status-value.fox { color: var(--fox-fire-b); }

/* user 状态行 */
.user-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  background: hsla(42, 68%, 60%, 0.04);
  border: 1px solid hsla(42, 68%, 60%, 0.15);
  border-radius: 2px;
  flex-wrap: wrap;
}
.user-row-label {
  font-family: var(--font-hand);
  font-size: 10.5px;
  color: var(--gold);
  letter-spacing: 2px;
  flex-shrink: 0;
  font-weight: 600;
}
.user-stat {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: 1;
  min-width: 80px;
}
.user-stat-name {
  font-family: var(--mono);
  font-size: 8.5px;
  color: var(--moon-dim);
  letter-spacing: 1px;
  flex-shrink: 0;
}
.user-stat-bar {
  flex: 1;
  height: 2.5px;
  background: hsla(42, 45%, 88%, 0.06);
  border-radius: 1px;
  overflow: hidden;
  min-width: 24px;
}
.user-stat-fill {
  height: 100%;
  border-radius: 1px;
  transition: width 0.9s ease;
  background: linear-gradient(90deg, hsla(42, 68%, 50%, 0.6), hsla(42, 68%, 62%, 0.9));
}
.user-stat-fill.protect {
  background: linear-gradient(90deg, hsla(28, 88%, 48%, 0.6), hsla(28, 88%, 60%, 0.9));
}
.user-stat-num {
  font-family: var(--mono);
  font-size: 9.5px;
  color: var(--moon);
  font-weight: 600;
  min-width: 18px;
  text-align: right;
  flex-shrink: 0;
}

/* 内心话 */
.inner-voice {
  margin-top: auto;
  position: relative;
  padding: 10px 12px 8px 32px;
  background: linear-gradient(135deg, hsla(42, 45%, 88%, 0.06), hsla(42, 45%, 88%, 0.02));
  border-left: 2px solid var(--fox-red);
  border-radius: 0 2px 2px 0;
  transition: all 0.4s ease;
}
.inner-voice::before {
  content: '「';
  position: absolute;
  top: 3px; left: 7px;
  font-family: var(--font-hand);
  font-size: 20px;
  color: var(--fox-red-b);
  opacity: 0.5;
  line-height: 1;
}
.inner-voice-text {
  font-family: var(--font-hand);
  font-size: 12px;
  color: var(--moon);
  line-height: 1.65;
  letter-spacing: 0.4px;
  word-break: break-word;
}
.inner-voice-author {
  font-family: var(--mono);
  font-size: 8px;
  color: var(--moon-dim);
  letter-spacing: 2px;
  text-align: right;
  margin-top: 4px;
  opacity: 0.55;
}

/* 事件进度（可点击） */
.event-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 18px;
  border-top: 1px solid var(--border);
  background: rgba(8, 6, 13, 0.55);
  backdrop-filter: blur(8px);
  cursor: pointer;
  transition: background 0.25s ease;
}
.event-bar:hover { background: hsla(352, 40%, 20%, 0.3); }

.event-bar-label {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--moon-dim);
  letter-spacing: 2.5px;
  flex-shrink: 0;
}
.event-bar-track {
  flex: 1;
  height: 2px;
  background: hsla(42, 45%, 88%, 0.07);
  border-radius: 1px;
  overflow: hidden;
  position: relative;
}
.event-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--fox-red), var(--fox-fire), var(--gold));
  border-radius: 1px;
  transition: width 0.9s ease;
  position: relative;
}
.event-bar-fill::after {
  content: '';
  position: absolute;
  right: 0; top: -1px; bottom: -1px;
  width: 12px;
  background: radial-gradient(ellipse at right, var(--fox-fire-b), transparent 70%);
  opacity: 0.9;
}
.event-bar-count {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--gold);
  letter-spacing: 0.5px;
  flex-shrink: 0;
  font-weight: 700;
}
.event-bar-arrow {
  font-family: var(--mono);
  font-size: 14px;
  color: var(--fox-red-b);
  flex-shrink: 0;
  opacity: 0.7;
  transition: transform 0.25s ease;
}
.event-bar:hover .event-bar-arrow {
  transform: translateX(3px);
  opacity: 1;
}

/* ═══ 第二页：事件详情 ═══ */
.events-page {
  padding: 14px 16px 14px 22px;
  min-height: 460px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
}

.events-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-bottom: 10px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.back-btn {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 1px solid var(--border-red);
  background: transparent;
  color: var(--fox-red-b);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s ease;
  flex-shrink: 0;
  font-family: var(--font-main);
  padding: 0;
}
.back-btn:hover {
  background: hsla(352, 62%, 46%, 0.2);
  border-color: var(--fox-red-b);
}

.events-title {
  font-family: var(--font-hand);
  font-size: 17px;
  color: var(--moon);
  letter-spacing: 5px;
  font-weight: 700;
  text-shadow: 0 0 12px var(--fox-red-glow);
}

.events-count {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--gold);
  font-weight: 700;
  letter-spacing: 0.5px;
}

.events-list {
  overflow-y: auto;
  flex: 1;
  padding-right: 6px;
}
.events-list::-webkit-scrollbar { width: 3px; }
.events-list::-webkit-scrollbar-thumb {
  background: hsla(352, 62%, 52%, 0.4);
  border-radius: 2px;
}

.event-stage-group { margin-bottom: 14px; }

.event-stage-title {
  font-family: var(--font-hand);
  font-size: 12.5px;
  color: var(--fox-red-b);
  letter-spacing: 2.5px;
  padding: 5px 10px;
  background: hsla(352, 62%, 46%, 0.1);
  border-left: 3px solid var(--fox-red);
  margin-bottom: 6px;
  font-weight: 700;
}

.event-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px;
  border-bottom: 1px dotted var(--border);
  font-family: var(--font-hand);
  font-size: 12.5px;
  transition: background 0.2s ease;
}
.event-item:hover { background: hsla(352, 40%, 20%, 0.2); }

.event-icon {
  flex-shrink: 0;
  width: 16px;
  text-align: center;
  font-size: 11px;
  color: var(--moon-dim);
  opacity: 0.5;
}
.event-item.done .event-icon {
  color: var(--fox-fire-b);
  opacity: 1;
  text-shadow: 0 0 8px var(--fox-fire);
}

.event-name {
  flex: 1;
  letter-spacing: 1px;
  color: var(--moon-dim);
}
.event-item.done .event-name {
  color: var(--moon);
  font-weight: 600;
}

.event-idx {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--moon-dim);
  opacity: 0.5;
  min-width: 18px;
  text-align: right;
}

/* ═══ 发情期特效 ═══ */
.panel.is-heat {
  border-color: hsla(352, 62%, 52%, 0.5);
  box-shadow:
    0 28px 70px rgba(0, 0, 0, 0.85),
    0 0 60px hsla(352, 62%, 52%, 0.22),
    0 0 120px hsla(28, 88%, 58%, 0.08),
    inset 0 0 120px hsla(352, 62%, 32%, 0.12);
}
.panel.is-heat .portrait {
  filter: brightness(1.06) saturate(1.15) contrast(1.02);
}
.panel.is-heat .foxfire {
  background: hsl(352, 70%, 62%);
  box-shadow: 0 0 8px hsl(352, 70%, 62%), 0 0 16px hsl(352, 70%, 62%), 0 0 28px hsla(352, 70%, 55%, 0.6);
}
.panel.is-heat .portrait::after {
  background: linear-gradient(to right, transparent 0%, hsla(352, 62%, 32%, 0.08) 40%, var(--night) 90%);
}

.panel.low-power .portrait {
  animation: power-flicker 6s ease-in-out infinite;
}
@keyframes power-flicker {
  0%, 93%, 100% { opacity: 1; }
  94% { opacity: 0.94; }
  95% { opacity: 0.98; }
  96% { opacity: 0.9; }
  97% { opacity: 0.96; }
  98% { opacity: 0.92; }
}
.panel.low-power .ninetails {
  opacity: 0.35;
  animation: tails-pulse 4s ease-in-out infinite;
}
@keyframes tails-pulse {
  0%, 100% { opacity: 0.35; }
  50% { opacity: 0.5; }
}

/* ═══ 响应式 ═══ */
@media (max-width: 540px) {
  body { padding: 8px 6px; }
  .panel::before, .panel::after { width: 22px; height: 22px; }
  
  .main-layout {
    flex-direction: column;
    min-height: auto;
  }
  
  .portrait-col {
    flex: 0 0 auto;
    width: 100%;
    height: 340px;
  }
  .portrait { background-position: center 15%; }
  .portrait::after {
    background: linear-gradient(to top, var(--night) 0%, transparent 60%);
    top: auto; bottom: 0; left: 0; right: 0;
    width: 100%; height: 65%;
  }
  .portrait::before { display: none; }
  
  .moon-ring { width: 260px; height: 260px; }
  .moon-halo { width: 200px; height: 200px; }
  
  .portrait-overlay { left: 12px; right: 12px; bottom: 14px; }
  .stage-seal { width: 46px; height: 46px; }
  .stage-seal-text { font-size: 8px; max-width: 38px; }
  .stage-label-name { font-size: 13px; letter-spacing: 3px; }
  
  .info-col { padding: 14px 14px 12px; gap: 9px; }
  .info-name { font-size: 19px; letter-spacing: 4px; }
  .info-race { font-size: 8px; }
  
  .stat-symbol { font-size: 11px; }
  .stat-name { font-size: 7px; }
  .stat-num { font-size: 11px; }
  
  .status-value { font-size: 11px; }
  .status-label { font-size: 7.5px; }
  
  .user-row { padding: 5px 8px; gap: 6px; }
  .user-row-label { font-size: 10px; }
  .user-stat-name { font-size: 8px; }
  .user-stat-num { font-size: 9px; }
  
  .inner-voice { padding: 9px 11px 8px 28px; }
  .inner-voice-text { font-size: 11.5px; }
  
  .heat-badge { top: 10px; left: 10px; font-size: 8px; }
  
  .event-bar { padding: 9px 14px; }
  
  .events-page { padding: 12px 12px 12px 16px; min-height: 400px; }
  .events-title { font-size: 15px; letter-spacing: 4px; }
}

@media (min-width: 720px) {
  .panel { max-width: 700px; }
  .main-layout { min-height: 470px; }
  .portrait-col { flex: 0 0 46%; }
  .info-col { padding: 22px 22px 18px 2px; }

  .stat-symbol { font-size: 12.5px; }
  .stat-name { font-size: 8px; }
  .stat-num { font-size: 13px; }
  .inner-voice-text { font-size: 13px; }
  .stage-seal { width: 62px; height: 62px; }
  .stage-seal-text { font-size: 10px; max-width: 50px; }
  .stage-label-name { font-size: 15px; letter-spacing: 4px; }
  .moon-ring { width: 380px; height: 380px; }
}

.panel.collapsed { box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75); }
.panel.collapsed::before,
.panel.collapsed::after { display: none; }
</style>
</head>

<script>
(function(){
'use strict';

var CDN_BASE = 'https://testingcf.jsdelivr.net/gh/sanshui19516/Plot-Advancement-Illustration-@main/%E4%BD%8F%E5%9C%A8%E9%9A%94%E5%A3%81%E7%9A%84%E7%8B%90%E4%BB%99%E5%A4%A7%E4%BA%BA/%E9%85%8D%E5%9B%BE/';

var STAGE_MAP = {
  '初识邻居': CDN_BASE + '%E5%88%9D%E8%AF%86%E9%82%BB%E5%B1%85.jpg',
  '秘密暴露': CDN_BASE + '%E7%A7%98%E5%AF%86%E6%9A%B4%E9%9C%B2.jpg',
  '发情之困': CDN_BASE + '%E5%8F%91%E6%83%85%E4%B9%8B%E5%9B%B0.jpg',
  '心意确认': CDN_BASE + '%E5%BF%83%E6%84%8F%E7%A1%AE%E8%AE%A4.jpg',
  '同居之诺': CDN_BASE + '%E5%90%8C%E5%B1%85%E4%B9%8B%E8%AF%BA.jpg'
};

/* 事件分组（18 个主线事件） */
var EVENT_GROUPS = [
  { title: '一 · 邻居与好奇', items: ['初次照面', '借东西', '请教问题', '第一次露出'] },
  { title: '二 · 身份暴露', items: ['彻底暴露', 'partial坦白', '约定保密', '研究感情'] },
  { title: '三 · 发情之困', items: ['发情期到来', '察觉异常', '请求陪伴', '关系拉近'] },
  { title: '四 · 心意确认', items: ['询问恋爱意义', '正式确认', '融入日常', '三百年告白'] },
  { title: '五 · 结局', items: ['开始同居', '孩子到来'] }
];
var EVENT_KEYS = EVENT_GROUPS.reduce(function(acc, g) { return acc.concat(g.items); }, []);

function $(id) { return document.getElementById(id); }

function unflatten(flat) {
  if (!flat || typeof flat !== 'object') return {};
  var keys = Object.keys(flat);
  if (keys.length === 0) return {};
  if (keys.every(function(k){ return k.indexOf('.') === -1; })) return flat;
  var result = {};
  for (var i = 0; i < keys.length; i++) {
    var key = keys[i];
    var val = flat[key];
    var parts = key.split('.');
    var cur = result;
    for (var j = 0; j < parts.length - 1; j++) {
      if (!cur[parts[j]]) cur[parts[j]] = {};
      cur = cur[parts[j]];
    }
    cur[parts[parts.length - 1]] = val;
  }
  return result;
}

function getStatData() {
  var raw = null;
  try {
    if (typeof getAllVariables === 'function') {
      var all = getAllVariables();
      raw = _.get(all, 'stat_data', null);
      if (!raw || Object.keys(raw).length === 0) raw = all;
    }
  } catch (e) {}
  if (!raw || typeof raw !== 'object') return {};
  return unflatten(raw);
}

function readVar(data, path, def) {
  var v = _.get(data, path);
  return v === undefined || v === null ? def : v;
}

function setText(id, val) {
  var el = $(id);
  if (el && el.textContent !== String(val)) el.textContent = val;
}
function setWidth(id, pct) {
  var el = $(id);
  if (el) el.style.width = Math.max(0, Math.min(100, pct)) + '%';
}

var lastStage = '';

function updateStageImages(stage) {
  if (stage === lastStage) return;
  var url = STAGE_MAP[stage] || STAGE_MAP['初识邻居'];
  
  var portrait = $('portrait');
  if (portrait) {
    portrait.style.opacity = '0';
    setTimeout(function() {
      portrait.style.backgroundImage = 'url("' + url + '")';
      portrait.style.opacity = '1';
    }, 300);
  }
  
  var bg = $('panelBg');
  if (bg) bg.style.backgroundImage = 'url("' + url + '")';
  
  var colAvatar = $('collapsedAvatarImg');
  if (colAvatar) colAvatar.src = url;
  
  lastStage = stage;
}

/* 事件列表渲染 */
var lastEventSnapshot = '';

function renderEventsPage(data) {
  var snapshot = JSON.stringify(data && data['事件'] ? data['事件'] : {});
  if (snapshot === lastEventSnapshot) return;
  lastEventSnapshot = snapshot;

  var listEl = $('eventsList');
  var countEl = $('eventsTotalCount');
  if (!listEl) return;

  var html = '';
  var doneTotal = 0;
  var total = EVENT_KEYS.length;

  EVENT_GROUPS.forEach(function(group) {
    html += '<div class="event-stage-group">';
    html += '<div class="event-stage-title">' + group.title + '</div>';
    group.items.forEach(function(name) {
      var done = readVar(data, '事件.' + name, false) === true;
      if (done) doneTotal++;
      var idx = EVENT_KEYS.indexOf(name) + 1;
      html += '<div class="event-item ' + (done ? 'done' : '') + '">';
      html += '<span class="event-icon">' + (done ? '✓' : '○') + '</span>';
      html += '<span class="event-name">' + name + '</span>';
      html += '<span class="event-idx">' + idx + '</span>';
      html += '</div>';
    });
    html += '</div>';
  });

  listEl.innerHTML = html;
  if (countEl) countEl.textContent = doneTotal + ' / ' + total;
}

function render() {
  var data = getStatData();
  if (!data || Object.keys(data).length === 0) return;

  var day = readVar(data, '世界.日期', 1);
  var time = readVar(data, '世界.当前时间', '18:45');
  var period = readVar(data, '世界.时段', '傍晚');
  var scene = readVar(data, '世界.当前场景', 'user公寓');

  setText('topScene', scene);
  setText('topSceneSub', 'Day ' + day + ' · ' + time + ' · ' + period);

  var favor = readVar(data, '苏九尾.好感度', 0);
  var trust = readVar(data, '苏九尾.信任度', 0);
  var power = readVar(data, '苏九尾.妖力值', 80);
  var desire = readVar(data, '苏九尾.欲望值', 0);
  var stage = readVar(data, '关系.阶段', '初识邻居');
  var emotion = readVar(data, '苏九尾.当前情绪', '平静');
  var innerVoice = readVar(data, '苏九尾.内心话', '');
  var heatStatus = readVar(data, '苏九尾.发情期状态', '未到');
  var heatCountdown = readVar(data, '苏九尾.发情倒计时', 90);
  var earStatus = readVar(data, '苏九尾.耳朵状态', '隐藏');
  var tailStatus = readVar(data, '苏九尾.尾巴状态', '隐藏');

  setText('numFavor', Math.round(favor));
  setWidth('barFavor', (favor / 300) * 100);

  setText('numTrust', Math.round(trust));
  setWidth('barTrust', trust);

  setText('numPower', Math.round(power));
  setWidth('barPower', power);

  setText('numDesire', Math.round(desire));
  setWidth('barDesire', desire);

  /* user 数据 */
  var curiosity = readVar(data, 'user.好奇度', 8);
  var protect = readVar(data, 'user.保护欲', 0);
  setText('numCuriosity', Math.round(curiosity));
  setWidth('barCuriosity', curiosity);
  setText('numProtect', Math.round(protect));
  setWidth('barProtect', protect);

  /* 发情周期 */
  var statusHeatEl = $('statusHeat');
  if (statusHeatEl) {
    var heatLabel = heatCountdown + ' 天';
    statusHeatEl.className = 'status-value';
    if (heatStatus === '发作中') {
      heatLabel = '发情中';
      statusHeatEl.classList.add('hot');
    } else if (heatStatus === '临近') {
      heatLabel = '临近 · ' + heatCountdown + ' 天';
      statusHeatEl.classList.add('warn');
    } else if (heatStatus === '缓解中') {
      heatLabel = '缓解中';
    }
    statusHeatEl.textContent = heatLabel;
  }

  /* 狐化状态 */
  var statusFoxEl = $('statusFox');
  if (statusFoxEl) {
    var foxText = '';
    var foxClass = 'status-value';
    if (earStatus === '隐藏' && tailStatus === '隐藏') {
      foxText = '完全隐藏';
    } else if (earStatus === '露出' && tailStatus !== '隐藏') {
      foxText = '完整呈现';
      foxClass += ' fox';
    } else if (earStatus === '半露') {
      foxText = '半露';
      foxClass += ' warn';
    } else {
      foxText = earStatus + ' / ' + tailStatus;
    }
    statusFoxEl.textContent = foxText;
    statusFoxEl.className = foxClass;
  }

  updateStageImages(stage);
  setText('stageSealText', stage);
  setText('stageLabelName', stage);
  setText('collapsedStage', stage);
  setText('collapsedEmotion', emotion + ' · 苏九尾');

  var colHeat = $('collapsedHeat');
  if (colHeat) {
    if (heatStatus === '发作中') {
      colHeat.textContent = '发情中';
      colHeat.className = 'collapsed-heat hot';
    } else if (heatStatus === '临近') {
      colHeat.textContent = '临近';
      colHeat.className = 'collapsed-heat hot';
    } else if (heatStatus === '缓解中') {
      colHeat.textContent = '缓解';
      colHeat.className = 'collapsed-heat';
    } else {
      colHeat.textContent = heatCountdown + '天';
      colHeat.className = 'collapsed-heat';
    }
  }

  setText('innerVoiceText', innerVoice || '（还没有想什么。）');

  var panel = $('panel');
  if (panel) {
    var isHeat = (heatStatus === '发作中' || heatStatus === '临近');
    if (isHeat) panel.classList.add('is-heat');
    else panel.classList.remove('is-heat');

    if (power <= 40) panel.classList.add('low-power');
    else panel.classList.remove('low-power');
  }

  var done = 0;
  for (var i = 0; i < EVENT_KEYS.length; i++) {
    if (readVar(data, '事件.' + EVENT_KEYS[i], false) === true) done++;
  }
  setText('eventBarCount', done + ' / ' + EVENT_KEYS.length);
  setWidth('eventBarFill', (done / EVENT_KEYS.length) * 100);

  renderEventsPage(data);
}

/* ═══ 翻页 ═══ */
var showingEvents = false;

function goToEvents() {
  var inner = $('viewInner');
  if (!inner) return;
  showingEvents = true;
  inner.classList.add('show-events');
  requestAnimationFrame(syncHeight);
}

function goToMain() {
  var inner = $('viewInner');
  if (!inner) return;
  showingEvents = false;
  inner.classList.remove('show-events');
  requestAnimationFrame(syncHeight);
}

/* ═══ 折叠状态 ═══ */
var COLLAPSE_KEY = 'sw_panel_collapsed';

function setCollapsed(collapsed) {
  var panel = $('panel');
  if (!panel) return;
  if (collapsed) panel.classList.add('collapsed');
  else panel.classList.remove('collapsed');
  try { localStorage.setItem(COLLAPSE_KEY, collapsed ? '1' : '0'); } catch (e) {}
  requestAnimationFrame(syncHeight);
}

function restoreCollapse() {
  try {
    var saved = localStorage.getItem(COLLAPSE_KEY);
    if (saved === '1') setCollapsed(true);
  } catch (e) {}
}

function toggleCollapse() {
  var panel = $('panel');
  if (!panel) return;
  var now = !panel.classList.contains('collapsed');
  setCollapsed(now);
}

/* ═══ 高度同步 ═══ */
function syncHeight() {
  try {
    var panel = $('panel');
    if (!panel) return;
    var height = panel.offsetHeight + 20;
    if (!height || height < 80) return;

    var frame = window.frameElement;
    if (frame && frame.tagName === 'IFRAME') {
      frame.style.height = height + 'px';
      frame.style.minHeight = 'unset';
      frame.style.maxHeight = 'unset';
      frame.style.overflow = 'hidden';
    }

    try {
      var iframes = window.parent.document.querySelectorAll('iframe');
      for (var i = 0; i < iframes.length; i++) {
        try {
          if (iframes[i].contentWindow === window) {
            iframes[i].style.height = height + 'px';
            iframes[i].style.minHeight = 'unset';
            iframes[i].style.maxHeight = 'unset';
            iframes[i].style.overflow = 'hidden';
            break;
          }
        } catch (e) {}
      }
    } catch (e) {}
  } catch (e) {}
}

/* ═══ 初始化 ═══ */
function boot() {
  restoreCollapse();

  var toggleBtn = $('toggleBtnExpand');
  if (toggleBtn) toggleBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    toggleCollapse();
  });

  var collapsedBar = $('collapsedBar');
  if (collapsedBar) collapsedBar.addEventListener('click', toggleCollapse);

  var eventBar = $('eventBar');
  if (eventBar) eventBar.addEventListener('click', goToEvents);

  var backBtn = $('backBtn');
  if (backBtn) backBtn.addEventListener('click', goToMain);

  render();
  setInterval(render, 1500);
}

function start() {
  var ready = function() {
    if (typeof waitGlobalInitialized === 'function') {
      Promise.resolve(waitGlobalInitialized('Mvu'))
        .then(function(){ boot(); })
        .catch(function(){ boot(); });
    } else {
      boot();
    }
  };
  if (typeof errorCatched === 'function') {
    try { errorCatched(ready)(); } catch (e) { ready(); }
  } else {
    ready();
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', start);
} else {
  start();
}

syncHeight();
setTimeout(syncHeight, 100);
setTimeout(syncHeight, 300);
setTimeout(syncHeight, 600);
setTimeout(syncHeight, 1000);
setInterval(syncHeight, 800);
window.addEventListener('resize', syncHeight);

})();
</script>
